# Deploys firestore.rules and firestore.indexes.json to Happa's project (from
# happa.config.json; never aadhat-management) when they change on main (#16). Hosting is deployed separately by
# firebase-hosting-merge.yml. Never runs on pull requests.
#
# The service account in FIREBASE_SERVICE_ACCOUNT_HAPPA needs, in
# addition to its hosting roles: Firebase Rules Admin
# (roles/firebaserules.admin) and Cloud Datastore Index Admin
# (roles/datastore.indexAdmin).
name: Deploy Firestore rules and indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - happa.config.json
      - .github/workflows/firestore-rules-deploy.yml
      - tools/ci/deploy-with-retry.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Firestore rules + indexes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        working-directory: rules-tests
        run: npm ci
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules

      - name: Resolve Happa project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: node scripts/happa-config.js guard --require-ready --require-sa --sa-env SA_JSON

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "Deploying as: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"

      # No --force: indexes that exist in the project but not in
      # firestore.indexes.json are reported, not deleted (the script refuses
      # --force and aadhat-management). Transient Google API errors (503, 500,
      # 429, ECONNRESET, deadline) are retried up to 4 attempts with 30s/60s/
      # 120s backoff; compile and permission errors fail at once with a hint.
      - name: Deploy rules and indexes
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          SA_EMAIL=$(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")
          node tools/ci/deploy-with-retry.js \
            --log "$RUNNER_TEMP/deploy.log" --project "$PROJECT_ID" --sa-email "$SA_EMAIL" \
            -- npx --yes firebase-tools@latest deploy \
              --only firestore:rules,firestore:indexes \
              --project "$PROJECT_ID" --non-interactive

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/deploy.log"
