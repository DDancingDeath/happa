# Deploys firestore.rules and firestore.indexes.json to Happa's project (from
# happa.config.json; never aadhat-management). Never runs on pull requests.
#
# On a push to main it is not triggered by itself: firebase-hosting-merge.yml
# calls it (workflow_call) BEFORE Hosting whenever the rules, indexes or config
# changed, and deploys Hosting only if this succeeded -- the rules are
# backward-compatible, so they must be live before the app that needs them.
# workflow_dispatch deploys only the rules and indexes (no Hosting), and only
# from main's current head (tools/ci/current-head.sh skips a stale commit).
#
# Self-healing: tools/ci/deploy-with-retry.js retries Firebase API outages
# (503/500/502/504/429/409, unavailable, ECONNRESET, deadline) up to 7 attempts
# with 15s..240s backoff; a 409 "Release ... already exists" counts as done when
# the live ruleset equals firestore.rules; the last step reads the live ruleset
# back (tools/ci/live-rules.js, read-only) and fails unless it equals the repo's.
#
# The service account in FIREBASE_SERVICE_ACCOUNT_HAPPA needs, in
# addition to its hosting roles: Firebase Rules Admin
# (roles/firebaserules.admin) and Cloud Datastore Index Admin
# (roles/datastore.indexAdmin).
name: Deploy Firestore rules and indexes

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test, deploy and verify Firestore rules + indexes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One rules deploy at a time (a manual dispatch and a push to main).
    concurrency:
      group: firestore-rules-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # A re-run of an old run, or a dispatch from another branch, must not
      # roll the rules back: every later step needs this commit to be main's head.
      - name: Is this commit still the head of main?
        id: head
        env:
          JOB_LABEL: rules
        run: bash tools/ci/current-head.sh
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        if: steps.head.outputs.current == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        if: steps.head.outputs.current == 'true'
        working-directory: rules-tests
        run: npm ci
      - name: Rules tests (Firestore emulator)
        if: steps.head.outputs.current == 'true'
        run: npm run test:rules
        env:
          # The rules tests once ran out of Node's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Resolve Happa project (refuses aadhat-management)
        if: steps.head.outputs.current == 'true'
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: node scripts/happa-config.js guard --require-ready --require-sa --sa-env SA_JSON

      - name: Write service account key
        if: steps.head.outputs.current == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "Deploying as: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"

      # No --force: indexes that exist in the project but not in
      # firestore.indexes.json are reported, not deleted (the script refuses
      # --force and aadhat-management). Transient Google API errors are retried
      # up to 7 attempts (15s/30s/60s/120s/180s/240s backoff); a 409 "Release
      # already exists" is accepted only if the live ruleset equals the repo's;
      # compile and permission errors fail at once with a hint.
      - name: Deploy rules and indexes
        if: steps.head.outputs.current == 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          SA_EMAIL=$(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")
          node tools/ci/deploy-with-retry.js \
            --log "$RUNNER_TEMP/deploy.log" --project "$PROJECT_ID" --sa-email "$SA_EMAIL" \
            --rules firestore.rules \
            -- npx --yes firebase-tools@latest deploy \
              --only firestore:rules,firestore:indexes \
              --project "$PROJECT_ID" --non-interactive

      # Read-only: fetches the cloud.firestore release's ruleset from the
      # Firebase Rules API and fails unless its source equals firestore.rules
      # (rechecked for ~2 minutes in case the release takes a moment to show).
      - name: Verify the live ruleset equals firestore.rules
        if: steps.head.outputs.current == 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: node tools/ci/live-rules.js verify --project "$PROJECT_ID" --rules firestore.rules

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/deploy.log"
