# Deploys Happa's production build on every push to main, to every hosting site
# in firebase.json (happaapp.web.app, the app's address, and happa-bfc07.web.app).
# The project and sites come from happa.config.json; the guard refuses the
# old app's project (aadhat-management), which is never deployed from here again.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Resolve Happa project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: node scripts/happa-config.js guard --require-ready --require-sa --sa-env SA_JSON
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
          channelId: live
          projectId: ${{ steps.project.outputs.project_id }}
      - name: Check every site serves this build
        env:
          SITES: ${{ steps.project.outputs.sites }}
        run: |
          want=$(grep -oP "const BUILD_ID = '\K[^']+" www/js/main.js)
          for s in ${SITES//,/ }; do
            got=''
            for i in 1 2 3 4 5 6; do
              got=$(curl -fsS "https://$s.web.app/js/main.js?cb=$GITHUB_RUN_ID-$i" | grep -oP "const BUILD_ID = '\K[^']+" || true)
              [ "$got" = "$want" ] && break
              sleep 10
            done
            echo "$s.web.app serves $got (want $want)"
            [ "$got" = "$want" ] || { echo "::error::$s.web.app does not serve $want"; exit 1; }
          done
