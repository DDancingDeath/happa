# Deploys Happa on every push to main: the Firestore rules and indexes first
# (when they changed), then Hosting -- the production build on the app's site,
# myhappa.web.app. The other sites in firebase.json (happaapp, happa-bfc07) get
# no app files, only a 301 of every path to myhappa (one origin, one offline store).
# The project and sites come from happa.config.json; the guard refuses the
# old app's project (aadhat-management), which is never deployed from here again.
#
# Order (after #196, where the new app ran ~25 minutes on the old rules and its
# writes were refused): rules are backward-compatible by design, so they go
# live before the app that needs them. "plan" decides whether the rules must be
# deployed (tools/ci/deploy-plan.js: any of firestore.rules,
# firestore.indexes.json, happa.config.json, firebase.json or the rules deploy
# tooling changed since the last successful run of this workflow); "rules"
# runs firestore-rules-deploy.yml (tests, retried deploy, live-ruleset check);
# Hosting runs only if the rules job succeeded or was not needed. A failed
# rules deploy leaves the live app untouched, fails this run and opens the
# [Ops] deploy alert issue; "Re-run failed jobs" retries rules, then Hosting.

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

# One deploy of main at a time, in order. A queued run replaced by a newer push
# loses nothing: the newer run's plan diffs from the last successful deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (rules before Hosting?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Do the Firestore rules or indexes need deploying first?
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: firebase-hosting-merge.yml
          BEFORE: ${{ github.event.before }}
        run: node tools/ci/deploy-plan.js

  rules:
    name: Firestore rules + indexes
    needs: plan
    if: needs.plan.outputs.rules == 'true'
    uses: ./.github/workflows/firestore-rules-deploy.yml
    secrets: inherit

  build_and_deploy:
    name: Hosting
    needs: [plan, rules]
    # Never after a failed or cancelled rules deploy: only when the rules are
    # live (success) or were not needed (plan said false, so the job skipped).
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.rules.result == 'success' ||
       (needs.rules.result == 'skipped' && needs.plan.outputs.rules == 'false'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Resolve Happa project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: node scripts/happa-config.js guard --require-ready --require-sa --sa-env SA_JSON
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
          channelId: live
          projectId: ${{ steps.project.outputs.project_id }}
      - name: Check the app site serves this build and the others redirect
        env:
          SITE: ${{ steps.project.outputs.site }}
          REDIRECT_SITES: ${{ steps.project.outputs.redirect_sites }}
        run: |
          want=$(grep -oP "const BUILD_ID = '\K[^']+" www/js/main.js)
          got=''
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://$SITE.web.app/js/main.js?cb=$GITHUB_RUN_ID-$i" | grep -oP "const BUILD_ID = '\K[^']+" || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          echo "$SITE.web.app serves $got (want $want)"
          [ "$got" = "$want" ] || { echo "::error::$SITE.web.app does not serve $want"; exit 1; }
          for s in ${REDIRECT_SITES//,/ }; do
            for p in / /download; do
              res=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://$s.web.app$p")
              echo "$s.web.app$p -> $res"
              [ "$res" = "301 https://$SITE.web.app$p" ] || { echo "::error::$s.web.app$p does not 301 to $SITE.web.app$p"; exit 1; }
            done
          done

  alert:
    name: Deploy alert
    needs: [plan, rules, build_and_deploy]
    if: ${{ !cancelled() && github.repository == 'DDancingDeath/happa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open / update / close the deploy alert issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_KIND: deploy
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_GOOD: ${{ needs.plan.result == 'success' && needs.build_and_deploy.result == 'success' && (needs.rules.result == 'success' || needs.rules.result == 'skipped') }}
        run: node tools/backup/alert.js