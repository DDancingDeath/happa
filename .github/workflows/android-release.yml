# Builds the Happa Android APK (identity from happa.config.json).
#  - Tag push v<version> (or manual re-run with a tag): signed release APK,
#    verified against the production signing cert, published as a GitHub Release.
#    A v<version>-rc<n> tag publishes a prerelease that is never marked latest.
#  - Pull requests touching the Android build: unsigned debug APK only (no release),
#    to catch build breakage before merge.

name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build and publish, e.g. v1.3.0 or v1.3.0-rc1 (prerelease). Leave empty for a build-only run.'
        required: false
        type: string
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'www/changelog.json'
      - 'www/js/version.js'
      - 'scripts/release.js'
      - 'scripts/release-notes.js'
      - 'scripts/happa-config.js'
      - 'happa.config.json'
      - 'tests/fixtures/google-services.dummy.json'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref }}
  # Never cancel a release half-way; superseded PR builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release: ${{ steps.mode.outputs.release }}
      tag: ${{ steps.mode.outputs.tag }}
      version: ${{ steps.mode.outputs.version }}
      prerelease: ${{ steps.mode.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Resolve build mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [[ "$EVENT" == "push" && "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == "workflow_dispatch" && "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            echo "Build-only run (debug APK, nothing is published)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # v1.3.0 = release (becomes "latest"); v1.3.0-rc1 = release candidate:
          # published as a prerelease and never marked latest, so the update
          # banner and /download (both read releases/latest) don't offer it.
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            echo "::error::Release tag '$tag' must look like v<major>.<minor>.<patch> (e.g. v1.3.0) or v<major>.<minor>.<patch>-rc<n> (e.g. v1.3.0-rc1)."
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          prerelease=false
          [[ -n "${BASH_REMATCH[2]}" ]] && prerelease=true
          echo "Release run for $tag (prerelease: $prerelease)"
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --ci

      - name: Check release consistency (versions + changelog)
        run: npm run check:release

      - name: Check Happa config (no placeholders, owner confirmed)
        if: steps.mode.outputs.release == 'true'
        run: npm run check:happa-config

      - name: Check tag matches version and render release notes
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.mode.outputs.tag }}
          BASE: ${{ steps.mode.outputs.base }}
          PRERELEASE: ${{ steps.mode.outputs.prerelease }}
        run: |
          # A release candidate (v1.3.0-rc1) is built from the commit whose version is 1.3.0.
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$pkg_version" != "$BASE" ]]; then
            echo "::error::Tag $TAG does not match package.json version $pkg_version. Tag the commit that bumped the version (npm run release)."
            exit 1
          fi
          mkdir -p dist
          if [[ "$PRERELEASE" == "true" ]]; then
            printf '**Release candidate %s** for testing. Not offered as an update; install it from this page only.\n\n' "$TAG" > dist/release-notes.md
          fi
          node scripts/release-notes.js "$BASE" >> dist/release-notes.md
          cat dist/release-notes.md

      - name: Require signing secrets
        if: steps.mode.outputs.release == 'true'
        env:
          HAPPA_KEYSTORE_BASE64: ${{ secrets.HAPPA_KEYSTORE_BASE64 }}
          HAPPA_KEYSTORE_PASSWORD: ${{ secrets.HAPPA_KEYSTORE_PASSWORD }}
          HAPPA_KEY_ALIAS: ${{ secrets.HAPPA_KEY_ALIAS }}
          HAPPA_KEY_PASSWORD: ${{ secrets.HAPPA_KEY_PASSWORD }}
          HAPPA_CERT_SHA256: ${{ vars.HAPPA_CERT_SHA256 }}
        run: |
          missing=()
          for name in HAPPA_KEYSTORE_BASE64 HAPPA_KEYSTORE_PASSWORD HAPPA_KEY_ALIAS HAPPA_KEY_PASSWORD HAPPA_CERT_SHA256; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secret(s)/variable: ${missing[*]}. Set them as in docs/happa-go-live.md. Refusing to publish an unsigned or unpinned APK."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the retired 'tools' package,
          # which current sdkmanager can't find (exit 1).
          packages: platform-tools

      - name: Sync Capacitor
        run: npx cap sync android

      # Crash reports (#122) and Google sign-in (docs/google-sign-in.md): the Firebase Android app's
      # config, when the owner has added it (docs/error-reporting.md). Without it the APK builds the
      # same way, with no Crashlytics and no Google sign-in (that plugin then doesn't start).
      - name: Add google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json added: crash reports can be switched on in the app; Google sign-in can start."
          else
            echo "No GOOGLE_SERVICES_JSON secret: the APK has no crash reporting and no Google sign-in."
          fi

      - name: Build debug APK (build-only)
        if: steps.mode.outputs.release != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: steps.mode.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: happa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Build signed release APK
        if: steps.mode.outputs.release == 'true'
        working-directory: android
        env:
          HAPPA_KEYSTORE_BASE64: ${{ secrets.HAPPA_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAPPA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.HAPPA_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.HAPPA_KEY_PASSWORD }}
        run: |
          # android/app/build.gradle reads ANDROID_KEYSTORE_FILE/_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          (umask 077 && printf '%s' "$HAPPA_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE")
          unset HAPPA_KEYSTORE_BASE64
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify APK signature and certificate
        if: steps.mode.outputs.release == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.HAPPA_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::Signed $apk was not produced (an unsigned build would be app-release-unsigned.apk)."
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apksigner.txt
          # apksigner prints "Signer #1 ..." or, in newer build-tools, "V2 Signer: ..."
          signers="$(grep -m1 '^Number of signers:' apksigner.txt | awk -F': ' '{print $2}' | tr -d ' \r' || true)"
          if [[ "$signers" != "1" ]]; then
            echo "::error::Expected exactly one signer, found ${signers:-0}."
            exit 1
          fi
          actual="$(grep -E -m1 '^(Signer #1|V[0-9.]+ Signer): certificate SHA-256 digest:|^Signer #1 certificate SHA-256 digest:' apksigner.txt | awk -F'digest: ' '{print $2}' | tr -d ': \r' | tr 'A-F' 'a-f')"
          if [[ -z "$actual" ]]; then
            echo "::error::Could not read the signing certificate SHA-256 from apksigner output."
            exit 1
          fi
          echo "Signing certificate SHA-256: $actual"
          echo "Signing certificate SHA-256: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': \t\r\n' | tr 'A-F' 'a-f')"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "::error::APK is signed with the WRONG key ($actual, expected $expected). Phones could not update to it. Check the HAPPA_KEYSTORE_* secrets and the HAPPA_CERT_SHA256 variable."
            exit 1
          fi
          echo "Certificate matches HAPPA_CERT_SHA256."
          want_pkg="$(node scripts/happa-config.js get androidPackage)"
          pkg="$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Package: $pkg"
          if [[ "$pkg" != "$want_pkg" || "$pkg" == "com.hitesh.aadhat" ]]; then
            echo "::error::APK package is '$pkg', expected '$want_pkg' (happa.config.json)."
            exit 1
          fi

      - name: Stage release files
        if: steps.mode.outputs.release == 'true'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          name="$(node -p "require('./happa.config.json').apkName")"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name-v$VERSION.apk"
          echo "$name" > dist/apk-name.txt
          (cd dist && sha256sum ./*.apk)

      - name: Upload release files
        if: steps.mode.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: happa-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # Crash reports (#122): Gradle applies the Google services and Crashlytics plugins only when
  # android/app/google-services.json exists, and the real one is the owner's secret. This job builds
  # that path with a FAKE config (tests/fixtures/google-services.dummy.json) so it can't break
  # unnoticed, and reports the APK size with and without it and the APK's permissions.
  crashlytics-build:
    name: Crashlytics build (dummy config)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build without a Firebase config (what ships today)
        working-directory: android
        run: |
          test ! -e app/google-services.json
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/without-config.apk"

      - name: Build with the dummy Firebase config
        run: |
          # Its package must be the APK's (happa.config.json), or the google-services plugin stops the build
          pkg="$(node scripts/happa-config.js get androidPackage)"
          jq --arg p "$pkg" '.client[0].client_info.android_client_info.package_name = $p' \
            tests/fixtures/google-services.dummy.json > android/app/google-services.json
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the Crashlytics path, report size and permissions
        run: |
          with=android/app/build/outputs/apk/debug/app-debug.apk
          without="$RUNNER_TEMP/without-config.apk"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          res="$("$aapt2" dump resources "$with")"
          # google-services wrote the (fake) app id; the Crashlytics plugin added its build id
          grep -q 'google_app_id' <<< "$res" || { echo "::error::google_app_id missing: the google-services plugin did not run"; exit 1; }
          # The SDK itself ships raw/firebase_crashlytics_keep, so look for the plugin's own string
          build_id='string/(com\.google\.firebase\.crashlytics\.mapping_file_id|com\.crashlytics\.android\.build_id)'
          if ! grep -Eq "$build_id" <<< "$res"; then
            echo "::error::no Crashlytics build id string: the Crashlytics Gradle plugin did not run"
            grep -i crashlytics <<< "$res" || true
            exit 1
          fi
          res_without="$("$aapt2" dump resources "$without")"
          if grep -Eq "google_app_id|$build_id" <<< "$res_without"; then
            echo "::error::the build without google-services.json has a Firebase app id or Crashlytics build id"; exit 1
          fi
          # Google sign-in (docs/google-sign-in.md): the native picker asks for the project's web client,
          # which google-services writes over the plugin's placeholder default_web_client_id
          if ! grep -A2 'string/default_web_client_id' <<< "$res" | grep -q 'cidummywebclient'; then
            echo "::error::default_web_client_id is not the config's web client: Google sign-in could not start"
            grep -A2 'string/default_web_client_id' <<< "$res" || true
            exit 1
          fi
          mb() { awk -v b="$(stat -c %s "$1")" 'BEGIN { printf "%.2f MB (%d bytes)", b / 1000000, b }'; }
          app_perms="$(grep -o 'uses-permission android:name="[^"]*"' android/app/src/main/AndroidManifest.xml | sed 's/.*name="//; s/"$//' | sort -u)"
          apk_perms="$("$aapt2" dump badging "$with" | sed -n 's/^uses-permission: name=.\([^'"'"']*\).*/\1/p' | sort -u)"
          grep -qx 'android.permission.INTERNET' <<< "$apk_perms" || { echo "::error::could not read the APK's permissions"; exit 1; }
          {
            echo "### Crashlytics build (dummy config)"
            echo "- Debug APK without the Firebase config: $(mb "$without")"
            echo "- Debug APK with the (dummy) Firebase config: $(mb "$with")"
            echo "- Permissions in the APK that android/app/src/main/AndroidManifest.xml doesn't declare (from libraries / plugins):"
            comm -13 <(echo "$app_perms") <(echo "$apk_perms") | sed 's/^/  - /'
            echo "- All permissions in the APK:"
            echo "$apk_perms" | sed 's/^/  - /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: happa-release
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          name="$(cat dist/apk-name.txt)"
          title="$name v$VERSION"
          files=("dist/$name.apk" "dist/$name-v$VERSION.apk")
          # Release candidates: prerelease, never "latest" (releases/latest feeds the update banner and /download).
          if [[ "$PRERELEASE" == "true" ]]; then
            flags=(--prerelease --latest=false)
            edit_flags=(--prerelease=true --latest=false)
          else
            flags=(--latest)
            edit_flags=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing assets."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file dist/release-notes.md --draft=false "${edit_flags[@]}"
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "$title" --notes-file dist/release-notes.md "${flags[@]}"
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [[ "$latest" == "$TAG" ]]; then
              echo "::error::Release candidate $TAG became the latest release."
              exit 1
            fi
            echo "Prerelease; latest release is still: ${latest:-none}"
          fi
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
