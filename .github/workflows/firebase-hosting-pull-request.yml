# Deploys a Happa preview channel on PR (test data, see firebaseConfig.js).
# Skipped until happa.config.json has the real project and the
# FIREBASE_SERVICE_ACCOUNT_HAPPA secret exists; never targets aadhat-management.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Resolve Happa project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
        run: node scripts/happa-config.js guard --sa-env SA_JSON
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.project.outputs.ready == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAPPA }}
          projectId: ${{ steps.project.outputs.project_id }}