# Builds and deploys Bahi to one of the new Firebase projects (#72): Firestore
# rules + indexes first, then Hosting, from happa.config.json "environments.<env>"
# (scripts/happa-config.js apply --env). The committed files keep pointing at the
# live project until cut-over, so this build step is the only place the new
# config is used. Called by bahi-deploy-prod.yml and bahi-deploy-dev.yml only.
#
# The service account needs Firebase Hosting Admin, Firebase Rules Admin and
# Cloud Datastore Index Admin on its project (dev also Cloud Datastore User for
# the sample data).
name: Bahi deploy (reusable)

on:
  workflow_call:
    inputs:
      env:
        description: prod or dev
        type: string
        required: true
      load_sample:
        description: dev only - load the sample items and bills after the deploy
        type: boolean
        default: false
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: bahi-deploy-${{ inputs.env }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.env }}
      SA_NAME: ${{ inputs.env == 'dev' && 'FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV' || 'FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA' }}
    steps:
      - uses: actions/checkout@v4
      # Prod deploys only main's head (an old re-run must not roll back); dev deploys any ref.
      - name: Is this commit current?
        id: head
        env:
          JOB_LABEL: Bahi ${{ inputs.env }}
        run: |
          if [ "$TARGET_ENV" = prod ]; then bash tools/ci/current-head.sh; else echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        if: steps.head.outputs.current == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: npm ci
      - name: Unit tests
        if: steps.head.outputs.current == 'true'
        run: npx jest --ci
      - name: Rules tests (Firestore emulator)
        if: steps.head.outputs.current == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci --prefix rules-tests
          npm run test:rules

      - name: Write the ${{ inputs.env }} config into the build
        if: steps.head.outputs.current == 'true'
        run: node scripts/happa-config.js apply --env "$TARGET_ENV"
      - name: Resolve the project (refuses the old ones and a dev/prod mix-up)
        if: steps.head.outputs.current == 'true'
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/happa-config.js guard --env "$TARGET_ENV" --require-ready --require-sa --sa-env SA_JSON --sa-name "$SA_NAME"

      - name: Write service account key
        if: steps.head.outputs.current == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules and indexes
        if: steps.head.outputs.current == 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          node tools/ci/deploy-with-retry.js \
            --log "$RUNNER_TEMP/deploy.log" --project "$PROJECT_ID" \
            --sa-email "$(jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS")" --rules firestore.rules \
            -- npx --yes firebase-tools@latest deploy \
              --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive
      - name: Verify the live ruleset equals firestore.rules
        if: steps.head.outputs.current == 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: node tools/ci/live-rules.js verify --project "$PROJECT_ID" --rules firestore.rules

      - name: Deploy Hosting
        if: steps.head.outputs.current == 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive
      - name: Check the site serves this build
        if: steps.head.outputs.current == 'true'
        env:
          SITE: ${{ steps.project.outputs.site }}
        run: |
          want=$(grep -oP "const BUILD_ID = '\K[^']+" www/js/main.js)
          got=''
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://$SITE.web.app/js/main.js?cb=$GITHUB_RUN_ID-$i" | grep -oP "const BUILD_ID = '\K[^']+" || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          echo "$SITE.web.app serves $got (want $want)"
          [ "$got" = "$want" ] || { echo "::error::$SITE.web.app does not serve $want"; exit 1; }

      # tools/dev/load-sample-data.js itself refuses any project not ending in -dev.
      - name: Load sample data (dev only)
        if: steps.head.outputs.current == 'true' && inputs.env == 'dev' && inputs.load_sample
        run: |
          npm ci --prefix tools/backup
          node tools/dev/load-sample-data.js --apply

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/deploy.log"
