# Mutation testing (#216, #160): how many deliberate small bugs in the money / stock /
# date code the tests catch. Non-blocking for now: it never fails a PR, it only
# reports the score (job summary + HTML report artifact). One job per file in
# stryker.config.json `mutate` (read from the config, so a new file is never
# skipped): with calc/billing.js one job no longer finished in 60 minutes (#160).
name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 0' # Mondays 04:00 IST

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: Files to mutate
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "files=$(node -p 'JSON.stringify(require("./stryker.config.json").mutate)')" >> "$GITHUB_OUTPUT"

  stryker:
    name: Stryker (${{ matrix.file }})
    needs: files
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run Stryker
        run: npm run test:mutation -- --concurrency 2 --mutate "${{ matrix.file }}"
      - name: Score summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = "reports/mutation/mutation.json";
            if (!fs.existsSync(f)) { console.log("no report"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            const rows = Object.entries(r.files).map(([file, d]) => {
              const c = (s) => d.mutants.filter(m => s.includes(m.status)).length;
              const killed = c(["Killed", "Timeout"]);
              const valid = killed + c(["Survived", "NoCoverage"]);
              return `| ${file} | ${valid ? (100 * killed / valid).toFixed(1) : "-"}% | ${killed} | ${c(["Survived"])} | ${c(["NoCoverage"])} |`;
            });
            const out = ["## Mutation score", "", "| File | Score | Killed | Survived | No coverage |", "|---|---|---|---|---|", ...rows].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
            console.log(out);
          '
      - name: Report name
        if: always()
        id: report
        run: echo "name=mutation-report-$(basename '${{ matrix.file }}' .js)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.report.outputs.name }}
          path: reports/mutation/
          retention-days: 14
