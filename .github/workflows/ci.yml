# Checks every PR and every push to main (#16).
# The hosting workflows (firebase-hosting-*.yml) still run Jest before deploying;
# this workflow adds the checks they don't run: lint, check:sw, check:release,
# Firestore rules tests, and the nightly read-only production smoke.
# The Playwright E2E suite (#127) has its own workflow, e2e.yml (every PR that
# changes the app; required check "Playwright E2E (emulators)").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # 03:00 IST nightly (production smoke only)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, Jest, release checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^1 = the base the PR merge commit was built on (cache-bump check)
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Service worker asset list
        run: npm run check:sw
      - name: Release metadata
        run: npm run check:release
      # On a PR the architecture ratchet compares tests/architecture-baseline.json with the base branch.
      - name: Fetch the PR base branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/$BASE"
      - name: Cache bump (cached www/ files changed)
        if: github.event_name == 'pull_request'
        run: node scripts/check-cache-bump.js HEAD^1
      - name: Jest
        run: npx jest --ci
        env:
          ARCH_REQUIRE_BASE: ${{ github.event_name == 'pull_request' && '1' || '' }}

  rules:
    name: Firestore rules tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        working-directory: rules-tests
        run: npm ci
      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
        env:
          # The rules tests once ran out of Node's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=4096

  prod-smoke:
    name: Production smoke (read-only)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke the live site (no login, no writes)
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
