<div id="stock" class="tab">
        
        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn active" onclick="window.app.stock.filterTab('current', event)">Current Stock</button>
            <button class="filter-btn" onclick="window.app.stock.filterTab('adjustment', event)">Stock Adjustment</button>
            <button class="filter-btn" id="deadStockTabBtn" style="display: none;" onclick="window.app.stock.filterTab('dead', event)">Not selling / नहीं बिक रहा</button>
        </div>

        <div id="deadStockSection" style="display: none;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                <label for="deadStockDays" style="font-weight: 600;">No sale in / बिक्री नहीं:</label>
                <select id="deadStockDays" onchange="window.app.stock.setDeadStockDays(this.value)">
                    <option value="30">30 days / दिन</option>
                    <option value="60">60 days / दिन</option>
                    <option value="90">90 days / दिन</option>
                </select>
            </div>
            <div id="deadStockSummary" style="font-size: 13px; color: #555; margin-bottom: 8px;"></div>
            <div id="deadStockList"></div>
        </div>

        <div id="currentStockSection">
            <div style="margin-bottom: 20px;">
                <input type="text" 
                       id="stockSearchInput" 
                       placeholder="🔍 Search items..."
                       style="width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; transition: all 0.2s;"
                       oninput="window.app.stock.searchStock()"
                       onfocus="this.style.borderColor='#3b82f6'; this.style.boxShadow='0 0 0 3px rgba(59, 130, 246, 0.1)'"
                       onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'">
            </div>
            <div id="stockList">
                <p style="text-align: center; color: #888; margin-top: 40px;">No stock data available</p>
            </div>
        </div>

        <div id="stockAdjustmentSection" style="display: none;">
            <div class="settings-card">
                <h3>Manual Stock Adjustment</h3>
                
                <div class="form-row">
                    <label>Select Item:</label>
                    <select id="adjustItem" onchange="window.app.stock.loadAdjustItemStock()">
                        <option value="">Select item</option>
                    </select>
                </div>
                
                <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin: 12px 0;">
                    <div style="font-size: 14px; color: #333;">
                        <strong>Current Stock:</strong> <span id="currentStockDisplay">-</span> kg
                    </div>
                    <div id="avgRateDisplay" data-perm="profit" style="font-size: 13px; color: #666; margin-top: 4px; display: none;">
                        <strong>Avg Rate:</strong> <span id="avgRateValue">-</span>
                    </div>
                </div>
                
                <div class="form-row">
                    <label>Adjustment Type:</label>
                    <select id="adjustType" onchange="window.app.stock.updateAdjustmentPlaceholder()">
                        <option value="add">Add Stock</option>
                        <option value="remove">Remove Stock</option>
                        <option value="set">Set Stock</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <label>Quantity (kg):</label>
                    <input type="number" inputmode="decimal" id="adjustQuantity" placeholder="Enter quantity" />
                </div>
                
                <div class="form-row">
                    <label>Rate (₹/kg) - Optional:</label>
                    <input type="number" inputmode="decimal" id="adjustRate" placeholder="0" value="0" />
                </div>
                
                <div class="form-row">
                    <label>Reason / कारण:</label>
                    <select id="adjustReasonCode">
                        <option value="">Select reason / कारण चुनें</option>
                        <option value="count">Physical count / गिनती</option>
                        <option value="damage">Damaged / खराब</option>
                        <option value="theft">Theft or loss / चोरी या गुम</option>
                        <option value="other">Other / अन्य</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <label>Note (required for Other) / टिप्पणी:</label>
                    <input type="text" id="adjustReason" placeholder="e.g., Rats damaged 2 bags" />
                </div>
                
                <button class="add-to-bill-btn" onclick="window.app.stock.applyAdjustment()">Apply Adjustment</button>
            </div>
            
            <h3>Adjustment History</h3>
            <div id="adjustmentHistory">
                <p style="text-align: center; color: #888; margin-top: 20px;">No adjustments yet</p>
            </div>
        </div>
    </div>
