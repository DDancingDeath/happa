<div id="stock" class="tab">
    <header class="page-head"><h2 data-i18n="ui.nav.stocks">Stock</h2></header>

        <div class="seg stock-seg" role="group">
            <button type="button" aria-pressed="true" data-onclick="stock.filterTab('current', event)" data-i18n="ui.stock.current_stock">Current stock</button>
            <button type="button" aria-pressed="false" data-onclick="stock.filterTab('adjustment', event)" data-i18n="ui.stock.stock_adjustment">Stock adjustment</button>
            <button type="button" aria-pressed="false" id="deadStockTabBtn" hidden data-onclick="stock.filterTab('dead', event)" data-i18n="ui.deadstock.tab">Not selling</button>
        </div>

        <div id="deadStockSection" hidden>
            <div class="stock-days">
                <label for="deadStockDays" data-i18n="ui.deadstock.no_sale_in">No sale in</label>
                <select id="deadStockDays" class="input" data-onchange="stock.setDeadStockDays(this.value)">
                    <option value="30" data-i18n="ui.deadstock.opt_30">30 days</option>
                    <option value="60" data-i18n="ui.deadstock.opt_60">60 days</option>
                    <option value="90" data-i18n="ui.deadstock.opt_90">90 days</option>
                </select>
            </div>
            <div id="deadStockSummary" class="stock-note"></div>
            <div id="deadStockList"></div>
        </div>

        <div id="currentStockSection">
            <div id="stockSummary" class="panel metrics stock-metrics" hidden>
                <div class="metric">
                    <div class="metric-label" data-i18n="ui.stock.summary_items">Items in stock</div>
                    <div id="stockSummaryItems" class="metric-value">0</div>
                </div>
                <div class="metric" id="stockSummaryKgCell">
                    <div class="metric-label" data-i18n="ui.stock.summary_kg">Total weight</div>
                    <div id="stockSummaryKg" class="metric-value">0 kg</div>
                </div>
                <div class="metric" id="stockSummaryValueCell" data-perm="stockValue">
                    <div class="metric-label" data-i18n="ui.stock.summary_value">Stock value</div>
                    <div id="stockSummaryValue" class="metric-value" data-metric="S4">₹0</div>
                </div>
            </div>
            <div class="search-field stock-search">
                <svg class="i" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
                <input type="text" class="input"
                       id="stockSearchInput"
                       placeholder="Search items…" data-i18n-placeholder="ui.stock.search_items"
                       aria-label="Search items…" data-i18n-aria-label="ui.stock.search_items"
                       data-oninput="stock.searchStock()">
            </div>
            <div id="stockList">
                <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-box"/></svg></span><b data-i18n="ui.stock.no_stock_data_available">No stock data available</b></div>
            </div>
        </div>

        <div id="stockAdjustmentSection" class="stock-adjust-layout" hidden>
            <div class="stock-count-bar">
                <button type="button" class="btn btn-tonal" data-stock-adjust data-onclick="stock.openStockCount()" data-i18n="ui.stock.count_btn">Count stock</button>
            </div>
            <div class="panel panel-pad stock-adjust-form">
                <h3 class="stock-title" data-i18n="ui.stock.manual_stock_adjustment">Manual stock adjustment</h3>

                <div class="field">
                    <label for="adjustItem" data-i18n="ui.stock.select_item">Select item</label>
                    <select id="adjustItem" class="input" data-onchange="stock.loadAdjustItemStock()">
                        <option value="" data-i18n="ui.wholesale.select_item">Select item</option>
                    </select>
                </div>

                <div class="metrics stock-now">
                    <div class="metric">
                        <div class="metric-label" data-i18n="ui.stock.current_stock">Current stock</div>
                        <div class="metric-value"><span id="currentStockDisplay">-</span> kg</div>
                    </div>
                    <div id="avgRateDisplay" class="metric" data-perm="profit" hidden>
                        <div class="metric-label" data-i18n="ui.wholesale.avg_purchase_rate">Avg purchase rate</div>
                        <div class="metric-value" id="avgRateValue">-</div>
                    </div>
                </div>

                <div class="field">
                    <label for="adjustType" data-i18n="ui.stock.adjustment_type">Adjustment type</label>
                    <select id="adjustType" class="input" data-onchange="stock.updateAdjustmentPlaceholder()">
                        <option value="add" data-i18n="ui.stock.add_stock">Add stock</option>
                        <option value="remove" data-i18n="ui.stock.remove_stock">Remove stock</option>
                        <option value="set" data-i18n="ui.stock.set_stock">Set stock</option>
                    </select>
                </div>

                <div class="field">
                    <label for="adjustQuantity" data-i18n="ui.wholesale.quantity">Quantity</label>
                    <div class="adorn">
                        <input type="number" inputmode="decimal" id="adjustQuantity" class="input" placeholder="Enter quantity" data-i18n-placeholder="ui.wholesale.enter_quantity" />
                        <span class="adorn-post">kg</span>
                    </div>
                </div>

                <div class="field">
                    <label for="adjustRate" data-i18n="ui.stock.rate_kg_optional">Rate (optional)</label>
                    <div class="adorn">
                        <span class="adorn-pre">₹</span>
                        <input type="number" inputmode="decimal" id="adjustRate" class="input" placeholder="0" value="0" />
                        <span class="adorn-post">/kg</span>
                    </div>
                </div>

                <div class="field">
                    <label for="adjustReasonCode" data-i18n="ui.stock.reason">Reason</label>
                    <select id="adjustReasonCode" class="input">
                        <option value="" data-i18n="ui.stock.select_reason">Select reason</option>
                        <option value="opening" data-i18n="ui.stock.reason_opening">Opening stock</option>
                        <option value="count" data-i18n="ui.stock.reason_count">Physical count</option>
                        <option value="damage" data-i18n="ui.stock.reason_damage">Damaged</option>
                        <option value="theft" data-i18n="ui.stock.reason_theft">Theft or loss</option>
                        <option value="other" data-i18n="ui.stock.reason_other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="adjustReason" data-i18n="ui.stock.note_required_other">Note (required for Other)</label>
                    <input type="text" id="adjustReason" class="input" placeholder="e.g., Rats damaged 2 bags" data-i18n-placeholder="ui.stock.e_g_rats_damaged_2" />
                </div>

                <button type="button" class="btn btn-primary btn-block" data-stock-adjust data-onclick="stock.applyAdjustment()" data-i18n="ui.stock.apply_adjustment">Apply adjustment</button>
            </div>

            <h3 class="stock-title" data-i18n="ui.stock.adjustment_history">Adjustment history</h3>
            <div id="adjustmentHistory">
                <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-list"/></svg></span><b data-i18n="ui.stock.no_adjustments_yet">No adjustments yet</b></div>
            </div>
        </div>
    </div>
