<div id="anomalies" class="tab">
    <div class="anomaly-page">
        <h2 class="anomaly-page-title">🚨 <span data-i18n="ui.anom.page_title">Anomalies</span></h2>
        <div id="anomalyDenied" class="anomaly-empty" style="display: none;" data-i18n="ui.anom.denied">Only the owner or a manager can see this page.</div>
        <div id="anomalyBody">
            <div class="anomaly-filters">
                <label><span data-i18n="ui.anom.f_dates">Dates</span>
                    <select id="anomalyFilterPreset" onchange="window.app.anomalies.applyFilters()">
                        <option value="today" data-i18n="ui.anom.p_today">Today</option>
                        <option value="yesterday" data-i18n="ui.anom.p_yesterday">Yesterday</option>
                        <option value="7d" data-i18n="ui.anom.p_7d">Last 7 days</option>
                        <option value="30d" data-i18n="ui.anom.p_30d">Last 30 days</option>
                        <option value="90d" data-i18n="ui.anom.p_90d">Last 90 days</option>
                    </select>
                </label>
                <label><span data-i18n="ui.anom.f_type">Type</span>
                    <select id="anomalyFilterType" onchange="window.app.anomalies.applyFilters()"></select>
                </label>
                <label><span data-i18n="ui.anom.f_severity">Severity</span>
                    <select id="anomalyFilterSeverity" onchange="window.app.anomalies.applyFilters()">
                        <option value="all" data-i18n="ui.anom.all">All</option>
                        <option value="high" data-i18n="ui.anom.sev_high">High</option>
                        <option value="medium" data-i18n="ui.anom.sev_medium">Medium</option>
                        <option value="low" data-i18n="ui.anom.sev_low">Low</option>
                    </select>
                </label>
                <label><span data-i18n="ui.anom.f_status">Status</span>
                    <select id="anomalyFilterStatus" onchange="window.app.anomalies.applyFilters()">
                        <option value="open" data-i18n="ui.anom.st_open">Open</option>
                        <option value="ok" data-i18n="ui.anom.st_ok">OK</option>
                        <option value="fixed" data-i18n="ui.anom.st_fixed">Fixed</option>
                        <option value="all" data-i18n="ui.anom.all">All</option>
                    </select>
                </label>
                <label><span data-i18n="ui.anom.f_user">User</span>
                    <select id="anomalyFilterUser" onchange="window.app.anomalies.applyFilters()">
                        <option value="all" data-i18n="ui.anom.all_users">All users</option>
                    </select>
                </label>
                <label><span data-i18n="ui.anom.f_item">Item</span>
                    <input type="search" id="anomalyFilterItem" placeholder="Item name" data-i18n-placeholder="ui.anom.item_name" oninput="window.app.anomalies.applyFilters()">
                </label>
            </div>

            <div class="sub-tabs">
                <button type="button" id="anomalyTabList" class="sub-tab active" onclick="window.app.anomalies.showView('list')">📋 <span data-i18n="ui.anom.tab_list">List</span></button>
                <button type="button" id="anomalyTabPatterns" class="sub-tab" onclick="window.app.anomalies.showView('patterns')">📊 <span data-i18n="ui.anom.tab_patterns">Patterns</span></button>
            </div>

            <div id="anomalySummary" class="anomaly-summary"></div>

            <div id="anomalyListView">
                <div id="anomalyList" class="anomaly-list"></div>
                <div style="text-align: center; margin: 12px 0;">
                    <button type="button" id="anomalyMore" class="btn btn-secondary" style="display: none;" onclick="window.app.anomalies.loadMore()" data-i18n="ui.anom.load_more">Load more</button>
                </div>
            </div>

            <div id="anomalyPatternView" style="display: none;">
                <div class="anomaly-pattern-grid">
                    <div class="modern-card anomaly-pattern-wide">
                        <h3 class="section-title" data-i18n="ui.anom.h_per_day">Per day by type</h3>
                        <div class="anomaly-chart-wrap"><canvas id="anomalyTrendChart"></canvas></div>
                        <div id="anomalyTrendLegend" class="anomaly-legend-row"></div>
                    </div>
                    <div class="modern-card anomaly-pattern-wide">
                        <h3 class="section-title" data-i18n="ui.anom.h_item_type">Item × type</h3>
                        <div id="anomalyHeat"></div>
                    </div>
                    <div class="modern-card">
                        <h3 class="section-title" data-i18n="ui.anom.h_by_user">By user</h3>
                        <div id="anomalyByUser"></div>
                    </div>
                    <div class="modern-card">
                        <h3 class="section-title" data-i18n="ui.anom.h_by_hour">By hour of day (IST)</h3>
                        <div id="anomalyByHour"></div>
                    </div>
                    <div class="modern-card anomaly-pattern-wide">
                        <h3 class="section-title" data-i18n="ui.anom.h_repeat">Repeat offenders (2+ days)</h3>
                        <div id="anomalyRepeat" class="anomaly-repeat"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
