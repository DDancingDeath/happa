<div id="anomalies" class="tab">
    <header class="page-head"><h2 data-i18n="ui.anom.page_title">Anomalies</h2></header>
    <p id="anomalyDenied" class="empty" hidden data-i18n="ui.anom.denied">Only the owner or a manager can see this page.</p>
    <div id="anomalyBody">
        <div class="panel panel-pad anom-filters">
            <div class="field">
                <label for="anomalyFilterPreset" data-i18n="ui.anom.f_dates">Dates</label>
                <select class="input" id="anomalyFilterPreset" data-onchange="anomalies.applyFilters()">
                    <option value="today" data-i18n="ui.anom.p_today">Today</option>
                    <option value="yesterday" data-i18n="ui.anom.p_yesterday">Yesterday</option>
                    <option value="7d" data-i18n="ui.anom.p_7d">Last 7 days</option>
                    <option value="30d" data-i18n="ui.anom.p_30d">Last 30 days</option>
                    <option value="90d" data-i18n="ui.anom.p_90d">Last 90 days</option>
                </select>
            </div>
            <div class="field">
                <label for="anomalyFilterType" data-i18n="ui.anom.f_type">Type</label>
                <select class="input" id="anomalyFilterType" data-onchange="anomalies.applyFilters()"></select>
            </div>
            <div class="field">
                <label for="anomalyFilterSeverity" data-i18n="ui.anom.f_severity">Severity</label>
                <select class="input" id="anomalyFilterSeverity" data-onchange="anomalies.applyFilters()">
                    <option value="all" data-i18n="ui.anom.all">All</option>
                    <option value="high" data-i18n="ui.anom.sev_high">High</option>
                    <option value="medium" data-i18n="ui.anom.sev_medium">Medium</option>
                    <option value="low" data-i18n="ui.anom.sev_low">Low</option>
                </select>
            </div>
            <div class="field">
                <label for="anomalyFilterStatus" data-i18n="ui.anom.f_status">Status</label>
                <select class="input" id="anomalyFilterStatus" data-onchange="anomalies.applyFilters()">
                    <option value="open" data-i18n="ui.anom.st_open">Open</option>
                    <option value="ok" data-i18n="ui.anom.st_ok">OK</option>
                    <option value="fixed" data-i18n="ui.anom.st_fixed">Fixed</option>
                    <option value="all" data-i18n="ui.anom.all">All</option>
                </select>
            </div>
            <div class="field">
                <label for="anomalyFilterUser" data-i18n="ui.anom.f_user">User</label>
                <select class="input" id="anomalyFilterUser" data-onchange="anomalies.applyFilters()">
                    <option value="all" data-i18n="ui.anom.all_users">All users</option>
                </select>
            </div>
            <div class="field">
                <label for="anomalyFilterItem" data-i18n="ui.anom.f_item">Item</label>
                <div class="search-field">
                    <svg class="i" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
                    <input type="search" class="input" id="anomalyFilterItem" placeholder="Item name" data-i18n-placeholder="ui.anom.item_name" data-oninput="anomalies.applyFilters()">
                </div>
            </div>
        </div>

        <div class="tabs anom-tabs" role="tablist">
            <button type="button" id="anomalyTabList" class="active" role="tab" aria-selected="true" data-onclick="anomalies.showView('list')"><span data-i18n="ui.anom.tab_list">List</span></button>
            <button type="button" id="anomalyTabPatterns" role="tab" aria-selected="false" data-onclick="anomalies.showView('patterns')"><span data-i18n="ui.anom.tab_patterns">Patterns</span></button>
        </div>

        <div id="anomalySummary" class="anom-summary" aria-live="polite"></div>

        <div id="anomalyListView">
            <div id="anomalyList" class="panel anom-list"></div>
            <div class="anom-more">
                <button type="button" id="anomalyMore" class="btn" hidden data-onclick="anomalies.loadMore()" data-i18n="ui.anom.load_more">Load more</button>
            </div>
        </div>

        <div id="anomalyPatternView" hidden>
            <div class="anom-patterns">
                <section class="panel panel-pad anom-wide">
                    <h3 class="anom-title" data-i18n="ui.anom.h_per_day">Per day by type</h3>
                    <div class="anom-chart"><canvas id="anomalyTrendChart"></canvas></div>
                    <div id="anomalyTrendLegend" class="anom-legend"></div>
                </section>
                <section class="panel panel-pad anom-wide">
                    <h3 class="anom-title" data-i18n="ui.anom.h_item_type">Item × type</h3>
                    <div id="anomalyHeat"></div>
                </section>
                <section class="panel panel-pad">
                    <h3 class="anom-title" data-i18n="ui.anom.h_by_user">By user</h3>
                    <div id="anomalyByUser"></div>
                </section>
                <section class="panel panel-pad">
                    <h3 class="anom-title" data-i18n="ui.anom.h_by_hour">By hour of day (IST)</h3>
                    <div id="anomalyByHour"></div>
                </section>
                <section class="panel panel-pad anom-wide">
                    <h3 class="anom-title" data-i18n="ui.anom.h_repeat">Repeat offenders (2+ days)</h3>
                    <div id="anomalyRepeat" class="anom-repeat"></div>
                </section>
            </div>
        </div>
    </div>
</div>
