<!-- Insights (redesign §5.3): what sells, to whom, when, at what margin, and what to act on. Figures from utils/business-metrics.js. -->
<div id="insights" class="tab ins-page">
    <div class="ins-head">
        <header class="page-head"><h2 data-i18n="ui.insights.title">Insights</h2></header>
        <button type="button" class="btn btn-ghost btn-sm ins-more" id="insightsCmpToggle" aria-expanded="false" aria-controls="insightsCmpMore" data-onclick="insights.toggleCompare()"><span data-i18n="ui.cmp.toggle">Compare</span> <svg class="i i-sm ins-cmp-chev" aria-hidden="true" focusable="false"><use href="#i-chevD"/></svg></button>
        <div class="tabs" role="tablist">
            <button type="button" class="active" data-insights-section="actions" role="tab" aria-selected="true" data-onclick="insights.setSection('actions')" data-i18n="ui.insights.tab_actions">To do</button>
            <button type="button" data-insights-section="items" role="tab" aria-selected="false" data-onclick="insights.setSection('items')" data-i18n="ui.insights.tab_items">Items</button>
            <button type="button" data-insights-section="parties" role="tab" aria-selected="false" data-onclick="insights.setSection('parties')" data-i18n="ui.insights.tab_parties">Parties</button>
            <button type="button" data-insights-section="seasons" role="tab" aria-selected="false" data-onclick="insights.setSection('seasons')" data-i18n="ui.insights.tab_seasons">Seasons</button>
        </div>
        <div class="ins-period" id="insightsPeriodBar">
            <button type="button" class="btn btn-icon" data-onclick="insights.step(-1)" aria-label="Earlier" data-i18n-aria-label="ui.money.earlier"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-chevL"/></svg></button>
            <span class="ins-period-label" id="insightsPeriodLabel"></span>
            <button type="button" class="btn btn-icon" data-onclick="insights.step(1)" aria-label="Later" data-i18n-aria-label="ui.money.later"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
            <select class="ins-preset" id="insightsPreset" data-onchange="insights.setPreset(this.value)" aria-label="Period" data-i18n-aria-label="ui.money.period">
                <option value="today" data-i18n="ui.money.p_today">Today</option>
                <option value="this-week" data-i18n="ui.money.p_this_week">This week</option>
                <option value="this-month" data-i18n="ui.money.p_this_month">This month</option>
                <option value="last-month" data-i18n="ui.money.p_last_month">Last month</option>
                <option value="this-year" data-i18n="ui.money.p_this_year">This year</option>
                <option value="last-year" data-i18n="ui.money.p_last_year">Last year</option>
                <option value="this-fy" data-i18n="ui.money.p_this_fy">This financial year</option>
                <option value="last-fy" data-i18n="ui.money.p_last_fy">Last financial year</option>
                <option value="last-30" data-i18n="ui.money.p_last_30">Last 30 days</option>
                <option value="custom" data-i18n="ui.cmp.choose_dates">Choose dates…</option>
            </select>
        </div>
        <div class="ins-abbar" id="insightsCmpBar"></div>
    </div>

    <section class="ins-section" data-insights-pane="actions">
        <div class="ins-wide">
            <h3 class="section-title" id="insightsActionsTitle"></h3>
            <div class="panel">
                <div id="insightsActionsDues" data-metric="I10"></div>
                <div id="insightsActionsBelow" data-metric="I8"></div>
                <div id="insightsActionsLow" data-metric="I7"></div>
                <div id="insightsActionsStock" data-metric="I9"></div>
                <div id="insightsActionsLinks"></div>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" data-go="money" data-metric-ref="M6"><span data-i18n="ui.insights.profit_link">Profit → Money</span> ›</button>
        </div>
    </section>

    <section class="ins-section" data-insights-pane="items" hidden>
        <div class="panel panel-pad ins-wide">
            <div class="ins-subtabs seg">
                <button type="button" class="active" aria-pressed="true" data-items-type="both" data-onclick="insights.setItemsType('both')" data-i18n="ui.insights.both">Both</button>
                <button type="button" aria-pressed="false" data-items-type="retail" data-onclick="insights.setItemsType('retail')" data-i18n="ui.insights.retail">Retail</button>
                <button type="button" aria-pressed="false" data-items-type="wholesale" data-onclick="insights.setItemsType('wholesale')" data-i18n="ui.insights.wholesale">Wholesale</button>
            </div>
            <div class="ins-takeaway ins-takeaway-dark" data-takeaway id="insightsItemsTakeaway"></div>
            <div class="ins-caveats" id="insightsItemsCaveats"></div>
            <div class="scroll-cue"><div class="ins-scroll scroll-cue-inner"><table class="table ins-items-table" id="insightsItemsTable" data-metric="I1"></table></div></div>
            <p class="ins-hint" data-i18n="ui.insights.items_hint">Tap an item to see its rate trend. Kg moved is in Product traffic.</p>
        </div>
        <div class="panel panel-pad">
            <h3 class="section-title" data-i18n="ui.insights.retail_vs_wholesale">Retail and wholesale</h3>
            <div id="insightsSplit" data-metric="I2"></div>
        </div>
        <div class="panel panel-pad">
            <h3 class="section-title" data-i18n="ui.insights.bought">What you bought</h3>
            <div class="ins-scroll"><table class="table" id="insightsBoughtTable" data-metric="I11"></table></div>
        </div>
    </section>

    <section class="ins-section" data-insights-pane="parties" hidden>
        <div class="panel panel-pad ins-wide">
            <div class="ins-subtabs seg">
                <button type="button" class="active" aria-pressed="true" data-party-kind="sales" data-onclick="insights.setPartyKind('sales')" data-i18n="ui.insights.customers">Customers</button>
                <button type="button" aria-pressed="false" data-party-kind="purchases" data-onclick="insights.setPartyKind('purchases')" data-i18n="ui.insights.suppliers">Suppliers</button>
            </div>
            <div class="ins-takeaway ins-takeaway-dark" data-takeaway id="insightsPartiesTakeaway"></div>
            <div class="ins-scroll"><table class="table" id="insightsCustomersTable" data-metric="I3"></table></div>
            <div class="ins-scroll"><table class="table" id="insightsSuppliersTable" data-metric="I4" hidden></table></div>
            <button type="button" class="btn btn-ghost btn-sm" data-go="due" data-metric-ref="O4"><span data-i18n="ui.insights.dues_link">Dues → Outstanding</span> ›</button>
        </div>
        <div class="panel panel-pad ins-wide" id="insightsStoppedCard">
            <h3 class="section-title" data-i18n="ui.insights.stopped_title">Regular buyers who stopped coming</h3>
            <div id="insightsStopped" data-metric-ref="I3"></div>
        </div>
    </section>

    <section class="ins-section" data-insights-pane="seasons" hidden>
        <div class="panel panel-pad ins-wide">
            <div class="ins-subtabs seg">
                <button type="button" class="active" aria-pressed="true" data-season-view="calendar" data-onclick="insights.setSeasonView('calendar')" data-i18n="ui.insights.calendar">Calendar</button>
                <button type="button" aria-pressed="false" data-season-view="trends" data-onclick="insights.setSeasonView('trends')" data-i18n="ui.insights.rate_trends">Rate trends</button>
                <button type="button" aria-pressed="false" data-season-view="traffic" data-onclick="insights.setSeasonView('traffic')" data-i18n="ui.insights.product_traffic">Product traffic</button>
            </div>
        </div>
        <div class="panel panel-pad ins-wide" id="insightsCalendarCard">
            <div class="ins-takeaway ins-takeaway-dark" data-takeaway id="insightsSeasonTakeaway"></div>
            <div class="ins-scroll" id="insightsCalendar" data-metric="I5"></div>
            <p class="ins-hint" data-i18n="ui.insights.calendar_hint">Darker = busier month for that item (kg sold, last 2 years). Tap a cell to see that month's traffic.</p>
        </div>
        <div class="ins-host ins-wide" id="insightsTrendsHost"></div>
    </section>

    <div class="ins-checks" id="insightsChecks"></div>
</div>
