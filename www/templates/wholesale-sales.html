<div id="wholesale-sales" class="tab">

        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn filter-sale active" onclick="window.app.wholesaleSales.filterTab('sales', event)" data-i18n="ui.common.sales">Sales</button>
            <button class="filter-btn filter-sale" onclick="window.app.wholesaleSales.filterTab('outstanding', event)" data-i18n="ui.wholesale.outstanding">Outstanding</button>
        </div>

        <div id="salesEntrySection">
            <div class="bill-col-entry">
            <div class="form-row">
                <label style="width: 100px;" data-i18n="ui.common.customer">Customer:</label>
                <div style="display: flex; gap: 8px; flex: 1; align-items: center;">
                    <input type="text" id="wholesaleCustomerName" list="wholesaleCustomerOptions" placeholder="Enter customer name" style="flex: 1;"  data-i18n-placeholder="ui.common.enter_customer_name"/>
                    <button onclick="window.app.wholesaleSales.pickContact()" style="padding: 8px 12px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; min-width: 40px; display: flex; align-items: center; justify-content: center;" title="Pick Contact" data-i18n-title="ui.common.pick_contact">👤</button>
                </div>
                <datalist id="wholesaleCustomerOptions"></datalist>
            </div>

            <div class="bill-totals" style="padding: 16px; margin-bottom: 16px;">
                <div class="form-row">
                    <label data-i18n="ui.common.item">Item:</label>
                    <select id="sellItem" onchange="window.app.wholesaleSales.loadItemDetails()"></select>
                </div>

                <div style="background: white; padding: 12px; border-radius: 8px; margin: 12px 0;">
                    <div style="font-size: 14px; color: #333;">
                        <strong data-i18n="ui.wholesale.available_stock">Available Stock:</strong> <span id="availableStock">-</span> kg<br>
                        <strong data-i18n="ui.wholesale.avg_purchase_rate">Avg Purchase Rate:</strong> ₹<span id="avgPurchaseRate">-</span>/kg
                        <div id="availableStockApprox" style="display: none; margin-top: 6px; font-size: 12px; color: #8a6d00;"></div>
                    </div>
                </div>

                <div class="form-row">
                    <label data-i18n="ui.wholesale.rate_kg">Rate (₹/kg):</label>
                    <input type="number" inputmode="decimal" id="sellRate" placeholder="Enter selling rate"  data-i18n-placeholder="ui.wholesale.enter_selling_rate"/>
                </div>

                <div class="form-row">
                    <label data-i18n="ui.wholesale.quantity_kg">Quantity (kg):</label>
                    <input type="number" inputmode="decimal" id="sellQuantity" placeholder="Enter quantity" onkeypress="if(event.key === 'Enter') { event.preventDefault(); window.app.wholesaleSales.addToWholesaleBill(); }"  data-i18n-placeholder="ui.wholesale.enter_quantity"/>
                </div>

                <button class="add-to-bill-btn" onclick="window.app.wholesaleSales.addToWholesaleBill()" style="background: #22c55e;" data-i18n="ui.common.add_bill">Add to Bill</button>
            </div>

        <h3 data-i18n="ui.common.bill_items">Bill Items</h3>
        <table id="salesTable">
            <thead>
                <tr>
                    <th data-i18n="ui.common.item_2">Item</th>
                    <th data-i18n="ui.common.rate">Rate</th>
                    <th data-i18n="ui.common.qty">Qty</th>
                    <th data-i18n="ui.common.total">Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
            </div>

            <div class="bill-col-summary">
        <div class="bill-totals">
            <div class="total-row grand-total" style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9); color: #2e7d32;">
                <span data-i18n="ui.common.total_receivable">Total Receivable:</span>
                <strong style="color: #22c55e !important;">₹ <span id="salesTotalAmount">0</span></strong>
            </div>

            <div class="payment-row">
                <label data-i18n="ui.common.online">Online (₹):</label>
                <input type="checkbox" id="wholesaleOnlineCheckbox" onchange="window.app.wholesaleSales.fillReceivableAmount('online')" />
                <input type="number" inputmode="decimal" id="wholesaleOnlinePayment" oninput="window.app.wholesaleSales.updatePaymentTotal();" placeholder="0" />
            </div>

            <div class="payment-row">
                <label data-i18n="ui.common.cash">Cash (₹):</label>
                <input type="checkbox" id="wholesaleCashCheckbox" onchange="window.app.wholesaleSales.fillReceivableAmount('cash')" />
                <input type="number" inputmode="decimal" id="wholesaleCashPayment" oninput="window.app.wholesaleSales.updatePaymentTotal();" placeholder="0" />
            </div>

            <div class="payment-row payment-total" style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;">
                <span style="color: #22c55e !important; font-weight: 600;" data-i18n="ui.common.total_received">Total Received:</span>
                <strong style="color: #22c55e !important;">₹ <span id="wholesaleTotalReceived" style="color: #22c55e !important;">0</span></strong>
            </div>

            <div class="payment-row">
                <label data-i18n="ui.common.due">Due (₹):</label>
                <input type="checkbox" id="wholesaleDueCheckbox" onchange="window.app.wholesaleSales.fillReceivableAmount('due')" />
                <input type="number" inputmode="decimal" id="wholesaleDueAmount" oninput="window.app.wholesaleSales.updatePaymentTotal();" placeholder="0" />
            </div>

            <div class="payment-row split-remaining-row">
                <span data-i18n="ui.common.not_split_yet">Not split yet:</span>
                <strong id="wholesaleSplitRemaining">₹0</strong>
                <button type="button" class="split-rest-btn" onclick="window.app.wholesaleSales.putRestInDue()" data-i18n="ui.common.rest_due">Rest → Due</button>
            </div>
        </div>

        <div class="bill-totals" style="margin-top: 16px;">
            <div class="payment-row">
                <label data-i18n="ui.wholesale.expenses">Expenses (₹):</label>
                <input type="number" inputmode="decimal" id="salesExpensesAmount" oninput="window.app.wholesaleSales.updateProfitCalculation();" placeholder="0" value="0" />
            </div>
            
            <div class="payment-row" data-perm="profit">
                <span data-i18n="ui.wholesale.profit">Profit:</span>
                <strong style="color: #22c55e;">₹ <span id="salesProfitAmount">0</span></strong>
            </div>
            
            <div class="payment-row" data-perm="profit">
                <span data-i18n="ui.wholesale.profit_2">Profit %:</span>
                <strong style="color: #22c55e;"><span id="salesProfitPercent">0</span>%</strong>
            </div>
        </div>

        <div class="form-row" style="margin-top: 16px;">
            <label style="width: 100px;" data-i18n="ui.wholesale.comments">Comments:</label>
            <input type="text" id="salesComments" />
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button onclick="window.app.wholesaleSales.shareViaWhatsApp()" style="flex: 1; padding: 12px; background: #25D366; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                WhatsApp
            </button>
            <button class="save-btn save-sale-btn" onclick="window.app.wholesaleSales.completeSale()" style="flex: 1; padding: 12px;" data-i18n="ui.common.save">Save</button>
            <button class="print-btn print-sale-btn" onclick="window.app.wholesaleSales.printWholesaleSale()" style="flex: 1; padding: 12px;" data-i18n="ui.common.print">Print</button>
        </div>
            </div>

        <h3 data-i18n="ui.wholesale.sales_history">Sales History</h3>
        <div id="salesHistoryList">
            <p style="text-align: center; color: #888; margin-top: 20px;" data-i18n="ui.wholesale.no_sales_yet">No sales yet</p>
        </div>
        </div>

        <div id="salesOutstandingSection" style="display: none;">
            <div id="salesOutstandingList">
                <p style="text-align: center; color: #888; margin-top: 20px;" data-i18n="ui.wholesale.no_outstanding_payments">No outstanding payments</p>
            </div>
        </div>
    </div>
