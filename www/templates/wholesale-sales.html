<div id="wholesale-sales" class="tab bill-page">
    <header class="page-head"><h2 data-i18n="ui.nav.sales">Sales</h2></header>

        <!-- Sales | History | Outstanding (redesign 5.5): the Billing components in the wholesale (violet) mode -->
        <div class="tabs ws-tabs" role="tablist">
            <button type="button" class="active" role="tab" aria-selected="true" aria-controls="salesEntrySection" data-view="sales" data-onclick="wholesaleSales.filterTab('sales', event)" data-i18n="ui.common.sales">Sales</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="salesHistorySection" data-view="history" data-onclick="wholesaleSales.filterTab('history', event)" data-i18n="ui.wholesale.tab_history">History</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="salesOutstandingSection" data-view="outstanding" data-onclick="wholesaleSales.filterTab('outstanding', event)" data-i18n="ui.wholesale.outstanding">Outstanding</button>
        </div>

        <div id="salesEntrySection" class="ws-entry">
            <div class="bill-col-entry">
            <div class="form-row field bill-customer">
                <label for="wholesaleCustomerName" data-i18n="ui.billing.customer_label">Customer</label>
                <div class="bill-customer-box">
                    <input type="text" class="input" id="wholesaleCustomerName" list="wholesaleCustomerOptions" placeholder="Enter customer name" data-i18n-placeholder="ui.common.enter_customer_name"/>
                    <button type="button" class="btn btn-ghost btn-icon" data-perm="contacts" data-onclick="wholesaleSales.pickContact()" title="Pick contact" aria-label="Pick contact" data-i18n-title="ui.common.pick_contact" data-i18n-aria-label="ui.common.pick_contact"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-contact"/></svg></button>
                </div>
                <datalist id="wholesaleCustomerOptions"></datalist>
            </div>

            <h3 class="bill-section-title" data-i18n="ui.billing.new_line">New line</h3>
            <div class="panel panel-pad bill-entry">
                <div class="form-row field">
                    <label for="sellItem" data-i18n="ui.common.item_2">Item</label>
                    <select id="sellItem" class="input" data-onchange="wholesaleSales.loadItemDetails()"></select>
                </div>

                <div id="wholesaleItemStats" class="ws-stock" hidden>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-label" data-i18n="ui.wholesale.available_stock">Available stock</div>
                            <div class="metric-value"><span id="availableStock">-</span><span id="availableStockUnit"> kg</span></div>
                        </div>
                        <div class="metric" id="avgPurchaseRateRow">
                            <div class="metric-label" data-i18n="ui.wholesale.avg_purchase_rate">Avg purchase rate</div>
                            <div class="metric-value"><span class="money"><span class="cur">₹</span><span id="avgPurchaseRate">-</span></span><span class="ws-per">/kg</span></div>
                        </div>
                    </div>
                    <p id="availableStockApprox" class="notice warn ws-stock-note" hidden></p>
                </div>

                <div class="bill-entry-grid ws-entry-grid">
                    <div class="form-row field">
                        <label for="sellRate" data-i18n="ui.wholesale.rate_kg">Rate</label>
                        <div class="adorn">
                            <span class="adorn-pre" aria-hidden="true">₹</span>
                            <input type="number" class="input" inputmode="decimal" id="sellRate" placeholder="Enter selling rate" data-i18n-placeholder="ui.wholesale.enter_selling_rate"/>
                            <span class="adorn-post" aria-hidden="true">/kg</span>
                        </div>
                    </div>
                    <div class="form-row field">
                        <label for="sellQuantity" data-i18n="ui.wholesale.quantity">Quantity</label>
                        <div class="adorn">
                            <input type="number" class="input" inputmode="decimal" id="sellQuantity" placeholder="Enter quantity" data-onenter="event.preventDefault(); wholesaleSales.addToWholesaleBill()" data-i18n-placeholder="ui.wholesale.enter_quantity"/>
                            <span class="adorn-post" aria-hidden="true">kg</span>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-tonal btn-block ws-add" data-onclick="wholesaleSales.addToWholesaleBill()"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg><span data-i18n="ui.common.add_bill">Add to bill</span></button>
            </div>

            <h3 class="bill-section-title" data-i18n="ui.billing.on_this_bill">On this bill</h3>
            <table id="salesTable" class="bill-lines">
                <thead>
                    <tr>
                        <th data-i18n="ui.common.item_2">Item</th>
                        <th data-i18n="ui.common.rate">Rate</th>
                        <th data-i18n="ui.common.qty">Qty</th>
                        <th data-i18n="ui.common.total">Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>

            <div class="bill-col-summary">
            <div class="bill-totals">
                <div class="total-row grand-total">
                    <span data-i18n="ui.billing.total_receivable_label">Total receivable</span>
                    <strong class="money"><span class="cur">₹</span><span id="salesTotalAmount">0</span></strong>
                </div>

                <div class="bill-pay-title" data-i18n="ui.billing.payment">Payment</div>

                <div class="payment-row">
                    <label for="wholesaleOnlinePayment" id="wholesaleOnlinePaymentLabel" data-i18n="ui.billing.online_label">Online</label>
                    <label class="pay-fill" title="Fill: put the whole bill here" data-i18n-title="ui.billing.fill_all"><input type="checkbox" id="wholesaleOnlineCheckbox" aria-describedby="wholesaleOnlinePaymentLabel" data-onchange="wholesaleSales.fillReceivableAmount('online')" /><span class="pay-fill-off" data-i18n="ui.billing.fill">Fill</span><span class="pay-fill-on" data-i18n="ui.billing.filled">Filled</span><span class="pay-fill-hint" data-i18n="ui.billing.fill_hint">(put the whole bill here)</span></label>
                    <div class="adorn bill-money">
                        <span class="adorn-pre" aria-hidden="true">₹</span>
                        <input type="number" class="input" inputmode="decimal" id="wholesaleOnlinePayment" data-oninput="wholesaleSales.updatePaymentTotal()" placeholder="0" />
                    </div>
                </div>

                <div class="payment-row">
                    <label for="wholesaleCashPayment" id="wholesaleCashPaymentLabel" data-i18n="ui.billing.cash_label">Cash</label>
                    <label class="pay-fill" title="Fill: put the whole bill here" data-i18n-title="ui.billing.fill_all"><input type="checkbox" id="wholesaleCashCheckbox" aria-describedby="wholesaleCashPaymentLabel" data-onchange="wholesaleSales.fillReceivableAmount('cash')" /><span class="pay-fill-off" data-i18n="ui.billing.fill">Fill</span><span class="pay-fill-on" data-i18n="ui.billing.filled">Filled</span><span class="pay-fill-hint" data-i18n="ui.billing.fill_hint">(put the whole bill here)</span></label>
                    <div class="adorn bill-money">
                        <span class="adorn-pre" aria-hidden="true">₹</span>
                        <input type="number" class="input" inputmode="decimal" id="wholesaleCashPayment" data-oninput="wholesaleSales.updatePaymentTotal()" placeholder="0" />
                    </div>
                </div>

                <div class="payment-row payment-total">
                    <span data-i18n="ui.billing.total_received_label">Total received</span>
                    <strong class="money"><span class="cur">₹</span><span id="wholesaleTotalReceived">0</span></strong>
                </div>

                <div class="payment-row">
                    <label for="wholesaleDueAmount" id="wholesaleDueAmountLabel" data-i18n="ui.billing.due_label">Due</label>
                    <label class="pay-fill" title="Fill: put the whole bill here" data-i18n-title="ui.billing.fill_all"><input type="checkbox" id="wholesaleDueCheckbox" aria-describedby="wholesaleDueAmountLabel" data-onchange="wholesaleSales.fillReceivableAmount('due')" /><span class="pay-fill-off" data-i18n="ui.billing.fill">Fill</span><span class="pay-fill-on" data-i18n="ui.billing.filled">Filled</span><span class="pay-fill-hint" data-i18n="ui.billing.fill_hint">(put the whole bill here)</span></label>
                    <div class="adorn bill-money">
                        <span class="adorn-pre" aria-hidden="true">₹</span>
                        <input type="number" class="input" inputmode="decimal" id="wholesaleDueAmount" data-oninput="wholesaleSales.updatePaymentTotal()" placeholder="0" />
                    </div>
                </div>

                <div class="payment-row split-remaining-row">
                    <span data-i18n="ui.billing.not_split_label">Not split yet</span>
                    <strong id="wholesaleSplitRemaining">₹0</strong>
                    <button type="button" class="btn btn-tonal btn-sm" data-onclick="wholesaleSales.putRestInDue()" data-i18n="ui.common.rest_due">Rest → due</button>
                </div>
            </div>

            <div class="panel ws-profit">
                <div class="payment-row">
                    <label for="salesExpensesAmount" data-i18n="ui.wholesale.expenses">Expenses</label>
                    <div class="adorn bill-money">
                        <span class="adorn-pre" aria-hidden="true">₹</span>
                        <input type="number" class="input" inputmode="decimal" id="salesExpensesAmount" data-oninput="wholesaleSales.updateProfitCalculation()" placeholder="0" value="0" />
                    </div>
                </div>
                <div class="payment-row" data-perm="profit">
                    <span data-i18n="ui.wholesale.profit">Profit</span>
                    <strong class="money"><span id="salesProfitSign"></span><span class="cur">₹</span><span id="salesProfitAmount">0</span></strong>
                </div>
                <div class="payment-row" data-perm="profit">
                    <span data-i18n="ui.wholesale.profit_2">Profit %</span>
                    <strong><span id="salesProfitPercent">0</span>%</strong>
                </div>
            </div>

            <div class="bill-notes-date">
            <div class="form-row field bill-notes">
                <label for="salesComments" data-i18n="ui.billing.notes_label">Notes</label>
                <input type="text" class="input" id="salesComments" />
            </div>

            <div class="form-row field bill-date">
                <label for="wholesaleDate" data-i18n="ui.billing.bill_date">Date</label>
                <input type="date" id="wholesaleDate" class="bill-date-input input" />
            </div>
            </div>

            <div class="bill-actions">
                <div class="bill-bar-total">
                    <span class="bill-bar-label" data-i18n="ui.billing.total_receivable_label">Total receivable</span>
                    <strong class="bill-bar-money money"><span class="cur">₹</span><span id="wholesaleBarTotal">0</span></strong>
                </div>
                <button type="button" data-onclick="wholesaleSales.shareViaWhatsApp()" class="btn btn-icon bill-share" title="Share draft (not saved)" data-i18n-title="ui.billing.share_draft">
                    <svg class="i i-fill" aria-hidden="true" focusable="false"><use href="#i-wa"/></svg>
                    <span class="sr-only" data-i18n="ui.billing.share_draft">Share draft (not saved)</span>
                </button>
                <button type="button" class="btn bill-print" id="printWholesaleBtn" data-onclick="wholesaleSales.printWholesaleSale()" data-kbd="Ctrl P">
                    <svg class="i" aria-hidden="true" focusable="false"><use href="#i-printer"/></svg>
                    <span class="bill-print-label" data-i18n="ui.common.print">Print</span>
                </button>
                <button type="button" class="btn btn-primary" id="saveWholesaleBtn" data-onclick="wholesaleSales.completeSale()" data-i18n="ui.common.save" data-kbd="Ctrl S">Save</button>
            </div>
            </div>

            <h3 class="bill-section-title" data-i18n="ui.wholesale.recent_sales">Recent wholesale bills</h3>
            <div id="salesRecentList">
                <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-receipt"/></svg></span><b data-i18n="ui.wholesale.no_sales_yet">No sales yet</b></div>
            </div>
            <div class="ws-more">
                <button type="button" class="btn btn-ghost btn-sm" data-onclick="wholesaleSales.filterTab('history')" data-i18n="ui.wholesale.see_all_history">See all in History</button>
            </div>
        </div>

        <div id="salesHistorySection" hidden>
            <div class="history-date-filter wholesale-history-controls">
                <label for="wholesaleHistoryPreset" class="history-date-label" data-i18n="ui.history.date">Date</label>
                <select id="wholesaleHistoryPreset" data-onchange="wholesaleSales.setHistoryPreset(this.value)">
                    <option value="all" data-i18n="ui.history.all_dates">All dates</option>
                    <option value="today" data-i18n="ui.history.today">Today</option>
                    <option value="yesterday" data-i18n="ui.history.yesterday">Yesterday</option>
                    <option value="week" data-i18n="ui.history.week">This week</option>
                    <option value="month" data-i18n="ui.history.month">This month</option>
                    <option value="lastMonth" data-i18n="ui.history.last_month">Last month</option>
                    <option value="custom" data-i18n="ui.history.custom">Custom</option>
                </select>
                <div id="wholesaleHistoryCustomRange" class="history-custom-range" hidden>
                    <input type="date" id="wholesaleHistoryFrom" class="input" aria-label="From date" min="2020-01-01" data-i18n-aria-label="ui.history.from_date">
                    <span aria-hidden="true">–</span>
                    <input type="date" id="wholesaleHistoryTo" class="input" aria-label="To date" min="2020-01-01" data-i18n-aria-label="ui.history.to_date">
                    <button type="button" class="btn btn-primary btn-sm history-apply-range" data-onclick="wholesaleSales.applyHistoryRange()" data-i18n="ui.history.apply">Apply</button>
                </div>
                <div id="wholesaleHistoryRangeHint" class="history-range-hint" role="alert" hidden></div>
            </div>

            <div class="ws-search">
                <svg class="i" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
                <input type="text" id="wholesaleHistorySearch" class="input" placeholder="Search by bill number, customer, or item…" aria-label="Search by bill number, customer, or item…"
                       data-oninput="wholesaleSales.searchHistory(this.value)" data-i18n-placeholder="ui.history.search_bill_number_customer" data-i18n-aria-label="ui.history.search_bill_number_customer"/>
                <button type="button" data-onclick="wholesaleSales.toggleHistoryView()" id="wholesaleHistoryViewToggle" class="btn btn-sm" data-i18n="ui.history.table_view">Table view</button>
            </div>

            <div id="salesHistoryList">
                <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-receipt"/></svg></span><b data-i18n="ui.wholesale.no_sales_yet">No sales yet</b></div>
            </div>
        </div>

        <div id="salesOutstandingSection" hidden>
            <div id="salesOutstandingList" class="due-list">
                <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-wallet"/></svg></span><b data-i18n="ui.wholesale.no_outstanding_payments">No outstanding payments</b></div>
            </div>
        </div>
    </div>
