<!-- Statements (redesign §5.4): day book, month statement, party ledger, item ledger, CSV. Documents on request; totals from the same rules as the pages. -->
<div id="statements" class="tab ins-page">
    <div class="ins-head">
        <header class="page-head"><h2 data-i18n="ui.statements.title">Statements</h2></header>
    </div>

    <div class="panel st-list" id="statementsList">
        <button type="button" class="row" data-onclick="statements.open('day')"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-calendar"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.day_book">Day book</span><span class="row-meta" data-i18n="ui.statements.day_book_hint">Everything of one day</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
        <button type="button" class="row" data-onclick="statements.open('month')"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-history"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.month">Month statement</span><span class="row-meta" data-i18n="ui.statements.month_hint">Profit, money and spending of a month</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
        <button type="button" class="row" data-onclick="statements.open('party')"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-user"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.party">Party ledger</span><span class="row-meta" data-i18n="ui.statements.party_hint">Bills and payments of one party, with balance</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
        <button type="button" class="row" data-onclick="statements.open('item')"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-box"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.item">Item ledger</span><span class="row-meta" data-i18n="ui.statements.item_hint">Stock and average cost of one item</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
        <button type="button" class="row" data-onclick="statements.open('csv')" data-owner-only><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-file"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.csv">Export CSV</span><span class="row-meta" data-i18n="ui.statements.csv_hint">Every bill line of a period, for Excel</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
        <button type="button" class="row" data-onclick="statements.open('accountant')" data-owner-only><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-list"/></svg></span><span class="row-main"><span class="row-title" data-i18n="ui.statements.accountant">Accountant CSV</span><span class="row-meta" data-i18n="ui.statements.accountant_list_hint">Bills and payments of a period, English headers</span></span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
    </div>

    <div class="st-view" id="statementsView" hidden>
        <div class="st-bar">
            <button type="button" class="ins-step" data-onclick="statements.back()" aria-label="Back" data-i18n-aria-label="ui.statements.back">‹</button>
            <strong id="statementsHeading"></strong>
        </div>
        <div class="panel panel-pad st-controls" id="statementsControls"></div>
        <div class="panel panel-pad st-doc" data-statement id="statementsDoc"></div>
        <div class="st-actions" id="statementsActions" data-owner-only>
            <button type="button" class="btn btn-secondary" data-onclick="statements.shareWhatsApp()" data-i18n="ui.statements.whatsapp">WhatsApp</button>
            <button type="button" class="btn btn-secondary" data-onclick="statements.print()" data-i18n="ui.statements.print">Print / PDF</button>
            <button type="button" class="btn btn-secondary" data-onclick="statements.downloadCsv()" data-i18n="ui.statements.download_csv">CSV</button>
        </div>
        <div class="st-csv-option" id="statementsCsvOption" hidden></div>
    </div>
</div>
