<!-- Statements (redesign §5.4): day book, month statement, party ledger, item ledger, CSV. Documents on request; totals from the same rules as the pages. -->
<div id="statements" class="tab ins-page">
    <div class="ins-head">
        <h2 class="ins-title"><span aria-hidden="true">🧾</span> <span data-i18n="ui.statements.title">Statements</span></h2>
    </div>

    <div class="st-list" id="statementsList">
        <button type="button" class="st-item" onclick="window.app.statements.open('day')"><span aria-hidden="true">📅</span><span><strong data-i18n="ui.statements.day_book">Day book</strong><small data-i18n="ui.statements.day_book_hint">Everything of one day</small></span><span aria-hidden="true">›</span></button>
        <button type="button" class="st-item" onclick="window.app.statements.open('month')"><span aria-hidden="true">🗓</span><span><strong data-i18n="ui.statements.month">Month statement</strong><small data-i18n="ui.statements.month_hint">Profit, money and spending of a month</small></span><span aria-hidden="true">›</span></button>
        <button type="button" class="st-item" onclick="window.app.statements.open('party')"><span aria-hidden="true">👤</span><span><strong data-i18n="ui.statements.party">Party ledger</strong><small data-i18n="ui.statements.party_hint">Bills and payments of one party, with balance</small></span><span aria-hidden="true">›</span></button>
        <button type="button" class="st-item" onclick="window.app.statements.open('item')"><span aria-hidden="true">📦</span><span><strong data-i18n="ui.statements.item">Item ledger</strong><small data-i18n="ui.statements.item_hint">Stock and average cost of one item</small></span><span aria-hidden="true">›</span></button>
        <button type="button" class="st-item" onclick="window.app.statements.open('csv')"><span aria-hidden="true">⬇</span><span><strong data-i18n="ui.statements.csv">Export CSV</strong><small data-i18n="ui.statements.csv_hint">Every bill line of a period, for Excel</small></span><span aria-hidden="true">›</span></button>
    </div>

    <div class="st-view" id="statementsView" hidden>
        <div class="st-bar">
            <button type="button" class="ins-step" onclick="window.app.statements.back()" aria-label="Back" data-i18n-aria-label="ui.statements.back">‹</button>
            <strong id="statementsHeading"></strong>
        </div>
        <div class="ins-card st-controls" id="statementsControls"></div>
        <div class="ins-card st-doc" data-statement id="statementsDoc"></div>
        <div class="st-actions">
            <button type="button" class="btn btn-secondary" onclick="window.app.statements.shareWhatsApp()" data-i18n="ui.statements.whatsapp">WhatsApp</button>
            <button type="button" class="btn btn-secondary" onclick="window.app.statements.print()" data-i18n="ui.statements.print">Print / PDF</button>
            <button type="button" class="btn btn-secondary" onclick="window.app.statements.downloadCsv()" data-i18n="ui.statements.download_csv">CSV</button>
        </div>
        <div class="st-csv-option" id="statementsCsvOption" hidden></div>
    </div>
</div>
