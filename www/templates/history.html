<div id="history" class="tab">
    <header class="page-head"><h2 data-i18n="ui.nav.history">History</h2></header>

        <div class="seg history-type-filter" role="group" aria-label="Bill type" data-i18n-aria-label="ui.history.bill_type">
            <button type="button" class="filter-purchase active" aria-pressed="true" data-type="purchase" data-onclick="history.filterHistory('purchase')"><span class="mode-dot" aria-hidden="true"></span><span data-i18n="ui.history.tab_purchase">Purchase</span></button>
            <button type="button" class="filter-sale" aria-pressed="false" data-type="sale" data-onclick="history.filterHistory('sale')"><span class="mode-dot sale" aria-hidden="true"></span><span data-i18n="ui.history.tab_sale">Sale</span></button>
        </div>

        <div class="history-date-filter">
            <label for="historyDatePreset" class="history-date-label" data-i18n="ui.history.date">Date</label>
            <select id="historyDatePreset" data-onchange="history.setDatePreset(this.value)">
                <option value="all" data-i18n="ui.history.all_dates">All dates</option>
                <option value="today" data-i18n="ui.history.today">Today</option>
                <option value="yesterday" data-i18n="ui.history.yesterday">Yesterday</option>
                <option value="week" data-i18n="ui.history.week">This week</option>
                <option value="month" data-i18n="ui.history.month">This month</option>
                <option value="lastMonth" data-i18n="ui.history.last_month">Last month</option>
                <option value="custom" data-i18n="ui.history.custom">Custom</option>
            </select>
            <div id="historyCustomRange" class="history-custom-range" hidden>
                <input type="date" id="historyFromDate" class="input" aria-label="From date" min="2020-01-01" data-i18n-aria-label="ui.history.from_date">
                <span aria-hidden="true">–</span>
                <input type="date" id="historyToDate" class="input" aria-label="To date" min="2020-01-01" data-i18n-aria-label="ui.history.to_date">
                <button type="button" class="btn btn-primary btn-sm history-apply-range" data-onclick="history.applyCustomRange()" data-i18n="ui.history.apply">Apply</button>
            </div>
            <div id="historyRangeHint" class="history-range-hint" role="alert" hidden></div>
            <div id="historyRangeLabel" class="history-range-label" hidden></div>
        </div>

        <div class="history-search">
            <svg class="i" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
            <input type="text" id="historySearch" class="input" placeholder="Search by bill number, customer, or item…" aria-label="Search by bill number, customer, or item…"
                   data-oninput="history.searchHistory(this.value)" data-i18n-placeholder="ui.history.search_bill_number_customer" data-i18n-aria-label="ui.history.search_bill_number_customer"/>
            <button type="button" data-onclick="history.toggleView()" id="historyViewToggle" class="btn btn-sm" data-i18n="ui.history.table_view">Table view</button>
        </div>

        <div id="historyList">
            <div class="empty"><span class="lead-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-receipt"/></svg></span><b data-i18n="ui.history.no_billing_history_yet">No billing history yet</b></div>
        </div>
        <div id="historySearchFooter" class="history-search-footer" hidden></div>
    </div>
