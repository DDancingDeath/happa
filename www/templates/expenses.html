<div id="expenses" class="tab">

        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn active" onclick="window.app.expenses.filterExpenseTab('business', event)" data-i18n="ui.expenses.business_expenses">Business Expenses</button>
            <button class="filter-btn" data-perm="personalExpenses" onclick="window.app.expenses.filterExpenseTab('personal', event)" data-i18n="ui.expenses.personal_expenses">Personal Expenses</button>
        </div>

        <!-- Business Expenses Section -->
        <div id="businessExpenseSection">
            <div class="expense-templates" id="businessExpenseTemplates" hidden></div>

            <div class="form-row">
                <label data-i18n="ui.expenses.expense_type">Expense Type:</label>
                <input type="text" id="businessExpenseType" list="businessExpenseTypeOptions" placeholder="Enter expense type" data-i18n-placeholder="ui.expenses.enter_expense_type" />
                <datalist id="businessExpenseTypeOptions">
                    <option value="Labor">
                    <option value="Salary">
                    <option value="Weighing Machine">
                    <option value="Electricity">
                    <option value="Rent">
                    <option value="Maintenance">
                    <option value="Transportation">
                </datalist>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.amount">Amount (₹):</label>
                <input type="number" inputmode="decimal" id="businessExpenseAmount" placeholder="Enter amount" data-i18n-placeholder="ui.cash.enter_amount" />
            </div>

            <div class="form-row">
                <label for="businessExpenseDate" data-i18n="ui.expenses.date">Date:</label>
                <input type="date" id="businessExpenseDate" />
            </div>

            <div class="form-row">
                <label for="businessExpenseMode" data-i18n="ui.expenses.paid_by">Paid by:</label>
                <select id="businessExpenseMode">
                    <option value="cash" data-i18n="ui.expenses.mode_cash">Cash</option>
                    <option value="online" data-i18n="ui.expenses.mode_online">Online</option>
                </select>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.person_name_optional">Person Name (Optional):</label>
                <input type="text" id="businessExpensePerson" list="businessExpensePersonOptions" placeholder="Enter name" data-i18n-placeholder="ui.expenses.enter_name" />
                <datalist id="businessExpensePersonOptions"></datalist>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.remarks_optional">Remarks (Optional):</label>
                <input type="text" id="businessExpenseRemarks" placeholder="Enter remarks" data-i18n-placeholder="ui.expenses.enter_remarks" />
            </div>

            <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button class="save-btn" data-expense-save onclick="window.app.expenses.saveBusinessExpense()" data-i18n="ui.expenses.save_expense">Save Expense</button>
                <button class="print-btn" data-expense-save onclick="window.app.expenses.saveAndPrintBusiness()" data-i18n="ui.expenses.print_expense">Print Expense</button>
            </div>

            <h3 data-i18n="ui.expenses.business_expense_history">Business Expense History</h3>
            <div class="expense-totals" id="businessExpenseTotals" aria-live="polite"></div>
            <div class="expense-search">
                <input type="search" id="businessExpenseSearch" placeholder="Search expenses" data-i18n-placeholder="ui.expenses.search_placeholder" aria-label="Search expenses" data-i18n-aria-label="ui.expenses.search_placeholder" oninput="window.app.expenses.onSearch('business')" />
                <select id="businessExpenseTypeFilter" aria-label="Expense type" data-i18n-aria-label="ui.expenses.expense_type" onchange="window.app.expenses.onSearch('business')"><option value="" data-i18n="ui.expenses.all_types">All types</option></select>
            </div>
            <label class="expenses-voided-toggle"><input type="checkbox" data-expense-voided-toggle onchange="window.app.expenses.toggleVoided(this.checked)"> <span data-i18n="ui.expenses.show_voided">Show voided</span></label>
            <div id="businessExpenseHistoryList">
                <p style="text-align: center; color: #888; margin-top: 40px;" data-i18n="ui.expenses.no_business_expenses_recorded_yet">No business expenses recorded yet</p>
            </div>
        </div>

        <!-- Personal Expenses Section -->
        <div id="personalExpenseSection" data-perm="personalExpenses" style="display: none;">
            <div class="expense-templates" id="personalExpenseTemplates" hidden></div>

            <div class="form-row">
                <label data-i18n="ui.expenses.expense_type">Expense Type:</label>
                <input type="text" id="personalExpenseType" list="personalExpenseTypeOptions" placeholder="Enter expense type" data-i18n-placeholder="ui.expenses.enter_expense_type" />
                <datalist id="personalExpenseTypeOptions">
                    <option value="Newspaper">
                    <option value="Bike Servicing">
                    <option value="Phone Bill">
                    <option value="Personal Shopping">
                    <option value="Medical">
                    <option value="Entertainment">
                </datalist>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.amount">Amount (₹):</label>
                <input type="number" inputmode="decimal" id="personalExpenseAmount" placeholder="Enter amount" data-i18n-placeholder="ui.cash.enter_amount" />
            </div>

            <div class="form-row">
                <label for="personalExpenseDate" data-i18n="ui.expenses.date">Date:</label>
                <input type="date" id="personalExpenseDate" />
            </div>

            <div class="form-row">
                <label for="personalExpenseMode" data-i18n="ui.expenses.paid_by">Paid by:</label>
                <select id="personalExpenseMode">
                    <option value="cash" data-i18n="ui.expenses.mode_cash">Cash</option>
                    <option value="online" data-i18n="ui.expenses.mode_online">Online</option>
                </select>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.person_name_optional">Person Name (Optional):</label>
                <input type="text" id="personalExpensePerson" list="personalExpensePersonOptions" placeholder="Enter name" data-i18n-placeholder="ui.expenses.enter_name" />
                <datalist id="personalExpensePersonOptions"></datalist>
            </div>

            <div class="form-row">
                <label data-i18n="ui.expenses.remarks_optional">Remarks (Optional):</label>
                <input type="text" id="personalExpenseRemarks" placeholder="Enter remarks" data-i18n-placeholder="ui.expenses.enter_remarks" />
            </div>

            <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button class="save-btn" data-expense-save onclick="window.app.expenses.savePersonalExpense()" data-i18n="ui.expenses.save_expense">Save Expense</button>
                <button class="print-btn" data-expense-save onclick="window.app.expenses.saveAndPrintPersonal()" data-i18n="ui.expenses.print_expense">Print Expense</button>
            </div>

            <h3 data-i18n="ui.expenses.personal_expense_history">Personal Expense History</h3>
            <div class="expense-totals" id="personalExpenseTotals" aria-live="polite"></div>
            <div class="expense-search">
                <input type="search" id="personalExpenseSearch" placeholder="Search expenses" data-i18n-placeholder="ui.expenses.search_placeholder" aria-label="Search expenses" data-i18n-aria-label="ui.expenses.search_placeholder" oninput="window.app.expenses.onSearch('personal')" />
                <select id="personalExpenseTypeFilter" aria-label="Expense type" data-i18n-aria-label="ui.expenses.expense_type" onchange="window.app.expenses.onSearch('personal')"><option value="" data-i18n="ui.expenses.all_types">All types</option></select>
            </div>
            <label class="expenses-voided-toggle"><input type="checkbox" data-expense-voided-toggle onchange="window.app.expenses.toggleVoided(this.checked)"> <span data-i18n="ui.expenses.show_voided">Show voided</span></label>
            <div id="personalExpenseHistoryList">
                <p style="text-align: center; color: #888; margin-top: 40px;" data-i18n="ui.expenses.no_personal_expenses_recorded_yet">No personal expenses recorded yet</p>
            </div>
        </div>

        <!-- Expense Details Modal -->
        <div class="bill-details-overlay" id="expenseDetailsOverlay">
            <div class="bill-details-container">
                <div class="bill-details-content" id="expenseDetailsContent">
                    <!-- Expense content will be inserted here -->
                </div>
                <div class="bill-details-footer">
                    <button class="bill-action-btn btn-delete" id="expenseVoidBtn" onclick="window.app.expenses.voidExpenseFromModal()"><span data-i18n="ui.expenses.void_btn">Void</span></button>
                    <button class="bill-action-btn btn-edit" id="expenseReenterBtn" onclick="window.app.expenses.reenterExpenseFromModal()"><span data-i18n="ui.expenses.reenter_btn">Void &amp; re-enter</span></button>
                    <button class="bill-action-btn btn-close" onclick="window.app.expenses.closeExpenseDetails()" data-i18n="ui.common.close">Close</button>
                </div>
            </div>
        </div>
    </div>
