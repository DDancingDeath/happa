<div id="due" class="tab">
        
        <div class="filter-buttons" style="margin-bottom: 20px;">
            <button class="filter-btn filter-purchase active" data-onclick="outstanding.filterDue('purchase', event)" data-i18n="ui.common.purchases">Purchases</button>
            <button class="filter-btn filter-sale" data-onclick="outstanding.filterDue('sale', event)" data-i18n="ui.common.sales">Sales</button>
        </div>
        <div class="filter-buttons" id="dueSaleKinds" style="margin-bottom: 16px;" hidden>
            <button type="button" class="filter-btn" data-due-kind="sale" data-onclick="outstanding.filterDue('sale')" data-i18n="ui.outstanding.kind_all">All</button>
            <button type="button" class="filter-btn" data-due-kind="retail" data-onclick="outstanding.filterDue('retail')" data-i18n="ui.outstanding.kind_retail">Retail</button>
            <button type="button" class="filter-btn" data-due-kind="wholesale" data-onclick="outstanding.filterDue('wholesale')" data-i18n="ui.outstanding.kind_wholesale">Wholesale</button>
        </div>

        <div style="margin-bottom: 20px;">
            <input type="text" 
                   id="outstandingSearchInput" 
                   placeholder="🔍 Search by customer name or ID..."
                   class="outstanding-search-input"
                   data-oninput="outstanding.searchOutstanding()" data-i18n-placeholder="ui.outstanding.search_customer_name_id">
        </div>

        <div id="dueAging"></div>

        <div id="dueList">
            <p style="text-align: center; color: #666; margin-top: 40px;" data-i18n="ui.outstanding.no_outstanding_amounts">No outstanding amounts</p>
        </div>
    </div>
