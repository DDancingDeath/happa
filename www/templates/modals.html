<!-- Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-header">
                <h3 id="modalTitle"><span data-i18n="ui.modals.alert">Alert</span></h3>
            </div>
            <div class="modal-body" id="modalBody">
                <div id="modalMessage"><span data-i18n="ui.modals.this_is_a_message">This is a message</span></div>
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="modal-btn modal-btn-cancel" id="modalCancel" data-dismiss data-onclick="ui.closeModal(false)" data-i18n="ui.modals.cancel">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm" data-onclick="ui.closeModal(true)" data-i18n="ui.modals.ok">OK</button>
            </div>
        </div>
    </div>

    <!-- BILL DETAILS OVERLAY -->
    <div class="bill-details-overlay" id="billDetailsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-content" id="billDetailsContent">
                <!-- Bill content will be inserted here -->
            </div>
            <div class="bill-details-footer">
                <button class="bill-action-btn btn-delete" id="billVoidBtn" data-onclick="history.confirmVoidBill()" data-i18n="ui.void.button">Void</button>
                <button class="bill-action-btn btn-delete" id="billDeleteBtn" style="display: none;" data-onclick="history.confirmDeleteBill()" data-i18n="ui.void.delete_permanently">Delete permanently</button>
                <button class="bill-action-btn btn-edit" id="billEditBtn" data-onclick="history.editCurrentBill()" data-i18n="ui.modals.edit">Edit</button>
                <button class="bill-action-btn btn-reprint" id="billReprintBtn" data-onclick="history.reprintBill()" title="Print a copy with the bill's date" data-i18n="ui.modals.reprint" data-i18n-title="ui.modals.print_copy_with_bill">Reprint</button>
                <button class="bill-action-btn btn-share" id="billShareBtn" data-onclick="history.shareBill()" title="Share on WhatsApp" data-i18n="ui.modals.share" data-i18n-title="ui.modals.share_on_whatsapp">Share</button>
                <button class="bill-action-btn btn-close" data-onclick="history.closeBillDetails()" data-i18n="ui.common.close">Close</button>
            </div>
        </div>
    </div>

    <!-- DRAFTS OVERLAY -->
    <div class="bill-details-overlay" id="draftsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-header">
                <h2 data-i18n="ui.modals.saved_drafts">Saved drafts</h2>
                <button type="button" class="bill-details-close" data-onclick="billing.closeDrafts()" aria-label="Close" data-i18n-aria-label="ui.common.close"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
            </div>
            <div class="bill-details-content" id="draftsContent" style="max-height: 60vh; overflow-y: auto;">
                <!-- Drafts will be inserted here -->
            </div>
        </div>
    </div>

    <!-- ITEM EDIT MODAL -->
    <div class="bill-details-overlay" id="itemEditOverlay" style="display: none;">
        <div class="bill-details-container item-modal">
            <div class="bill-details-header">
                <h2 id="itemModalTitle" data-i18n="ui.items.dialog_add_title">Add item</h2>
            </div>
            <div class="bill-details-content item-modal-body">
                <div class="field">
                    <label for="itemModalName" data-i18n="ui.modals.item_name_english">Item name (English)*</label>
                    <input type="text" id="itemModalName" class="input"
                           data-oninput="items.onModalNameInput('name')" data-onfocus="items.acceptNameSuggestion('name')"
                           placeholder="Enter item name" data-i18n-placeholder="ui.modals.enter_item_name">
                </div>

                <div class="field">
                    <label for="itemModalHindiName" data-i18n="ui.items.hindi_name_label">Hindi name</label>
                    <input type="text" id="itemModalHindiName" class="input"
                           data-oninput="items.onModalNameInput('hindiName')" data-onfocus="items.acceptNameSuggestion('hindiName')"
                           placeholder="Hindi name (optional)" data-i18n-placeholder="ui.items.hindi_name_optional">
                </div>

                <div class="field" data-perm="purchaseRates">
                    <label data-i18n="ui.modals.purchase_rates_kg">Purchase rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalPurchaseRates" class="rates-container"></div>
                        <button class="add-rate-plus purchase" data-onclick="items.addModalRate('purchase')">+</button>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="ui.modals.wholesale_rates_kg">Wholesale rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalWholesaleRates" class="rates-container"></div>
                        <button class="add-rate-plus wholesale" data-onclick="items.addModalRate('wholesale')">+</button>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="ui.modals.retail_sale_rates_kg">Retail rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalSaleRates" class="rates-container"></div>
                        <button class="add-rate-plus sale" data-onclick="items.addModalRate('sale')">+</button>
                    </div>
                </div>

                <div class="field">
                    <label for="itemModalContactPerson" data-i18n="ui.modals.contact_person">Contact person</label>
                    <input type="text" id="itemModalContactPerson" class="input"
                           placeholder="Enter contact person name (optional)" data-i18n-placeholder="ui.modals.enter_contact_person_name">
                </div>

                <div id="itemModalHistorySection" class="field" style="display: none;">
                    <label data-i18n="ui.modals.change_history">Change history</label>
                    <button type="button" id="itemModalHistoryBtn" class="filter-btn" data-onclick="items.loadModalHistory()" data-i18n="ui.modals.show_rate_name_changes">Show rate &amp; name changes</button>
                    <div id="itemModalHistoryList"></div>
                </div>
                <div class="item-modal-danger">
                    <button type="button" class="item-delete-btn" id="itemModalArchiveBtn" data-onclick="items.archiveFromModal()" style="display: none;" data-i18n="ui.items.archive_item">Archive item</button>
                </div>
            </div>
            <div class="bill-details-footer item-modal-footer">
                <button type="button" class="btn btn-ghost" data-dismiss data-onclick="items.closeItemModal()" data-i18n="ui.modals.cancel">Cancel</button>
                <button type="button" class="btn btn-primary" data-onclick="items.saveItemFromModal()" data-i18n="ui.common.save">Save</button>
            </div>
        </div>
    </div>
