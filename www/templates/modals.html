<!-- App dialog (ui-manager.js): a .dialog from 600 px, a bottom .sheet below, over a .scrim -->
    <div class="scrim app-scrim" id="modalOverlay">
        <div class="app-dialog dialog" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage" tabindex="-1">
            <div class="grabber" aria-hidden="true"></div>
            <div id="modalHeader">
                <h3 class="dialog-title" id="modalTitle"><span data-i18n="ui.modals.alert">Alert</span></h3>
            </div>
            <div class="dialog-body" id="modalBody">
                <div id="modalMessage"><span data-i18n="ui.modals.this_is_a_message">This is a message</span></div>
            </div>
            <div class="dialog-actions" id="modalFooter">
                <button type="button" class="btn btn-ghost" id="modalCancel" data-dismiss data-onclick="ui.closeModal(false)" data-i18n="ui.modals.cancel">Cancel</button>
                <button type="button" class="btn btn-primary" id="modalConfirm" data-onclick="ui.closeModal(true)" data-i18n="ui.modals.ok">OK</button>
            </div>
        </div>
    </div>

    <!-- BILL DETAILS OVERLAY -->
    <div class="bill-details-overlay" id="billDetailsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-content" id="billDetailsContent">
                <!-- Bill content will be inserted here -->
            </div>
            <div class="bill-details-footer">
                <button type="button" class="btn btn-ghost" data-dismiss data-onclick="history.closeBillDetails()" data-i18n="ui.common.close">Close</button>
                <button type="button" class="btn btn-danger" id="billVoidBtn" data-onclick="history.confirmVoidBill()" data-i18n="ui.void.button">Void</button>
                <button type="button" class="btn btn-danger" id="billDeleteBtn" hidden data-onclick="history.confirmDeleteBill()" data-i18n="ui.void.delete_permanently">Delete permanently</button>
                <button type="button" class="btn btn-tonal" id="billReprintBtn" data-onclick="history.reprintBill()" title="Print a copy with the bill's date" data-i18n="ui.modals.reprint" data-i18n-title="ui.modals.print_copy_with_bill">Reprint</button>
                <button type="button" class="btn btn-tonal" id="billShareBtn" data-onclick="history.shareBill()" title="Share on WhatsApp" data-i18n="ui.modals.share" data-i18n-title="ui.modals.share_on_whatsapp">Share</button>
                <button type="button" class="btn btn-primary" id="billEditBtn" data-onclick="history.editCurrentBill()" data-i18n="ui.modals.edit">Edit</button>
            </div>
        </div>
    </div>

    <!-- DRAFTS OVERLAY -->
    <div class="bill-details-overlay" id="draftsOverlay">
        <div class="bill-details-container">
            <div class="bill-details-header">
                <h2 data-i18n="ui.modals.saved_drafts">Saved drafts</h2>
                <button type="button" class="btn btn-ghost btn-icon" data-dismiss data-onclick="billing.closeDrafts()" aria-label="Close" data-i18n-aria-label="ui.common.close"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
            </div>
            <div class="bill-details-content drafts-list" id="draftsContent">
                <!-- Drafts will be inserted here -->
            </div>
        </div>
    </div>

    <!-- ITEM EDIT MODAL -->
    <div class="bill-details-overlay" id="itemEditOverlay">
        <div class="bill-details-container item-modal">
            <div class="bill-details-header">
                <h2 id="itemModalTitle" data-i18n="ui.items.dialog_add_title">Add rate</h2>
            </div>
            <div class="bill-details-content item-modal-body">
                <div class="field">
                    <label for="itemModalName" data-i18n="ui.modals.item_name_english">Item name (English)*</label>
                    <input type="text" id="itemModalName" class="input"
                           data-oninput="items.onModalNameInput('name')" data-onfocus="items.acceptNameSuggestion('name')"
                           placeholder="Enter item name" data-i18n-placeholder="ui.modals.enter_item_name">
                </div>

                <div class="field">
                    <label for="itemModalHindiName" data-i18n="ui.items.hindi_name_label">Hindi name</label>
                    <input type="text" id="itemModalHindiName" class="input"
                           data-oninput="items.onModalNameInput('hindiName')" data-onfocus="items.acceptNameSuggestion('hindiName')"
                           placeholder="Hindi name (optional)" data-i18n-placeholder="ui.items.hindi_name_optional">
                </div>

                <div class="field" data-perm="purchaseRates">
                    <label data-i18n="ui.modals.purchase_rates_kg">Purchase rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalPurchaseRates" class="rates-container"></div>
                        <button type="button" class="btn btn-tonal btn-icon" data-onclick="items.addModalRate('purchase')" aria-label="Add rate" data-i18n-aria-label="ui.items.add_item"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="ui.modals.wholesale_rates_kg">Wholesale rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalWholesaleRates" class="rates-container"></div>
                        <button type="button" class="btn btn-tonal btn-icon" data-onclick="items.addModalRate('wholesale')" aria-label="Add rate" data-i18n-aria-label="ui.items.add_item"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="ui.modals.retail_sale_rates_kg">Retail rates (₹/kg)</label>
                    <div class="item-modal-rates">
                        <div id="itemModalSaleRates" class="rates-container"></div>
                        <button type="button" class="btn btn-tonal btn-icon" data-onclick="items.addModalRate('sale')" aria-label="Add rate" data-i18n-aria-label="ui.items.add_item"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
                    </div>
                </div>

                <div class="field">
                    <label for="itemModalContactPerson" data-i18n="ui.modals.contact_person">Contact person</label>
                    <input type="text" id="itemModalContactPerson" class="input"
                           placeholder="Enter contact person name (optional)" data-i18n-placeholder="ui.modals.enter_contact_person_name">
                </div>

                <div id="itemModalHistorySection" class="field" hidden>
                    <label data-i18n="ui.modals.change_history">Change history</label>
                    <button type="button" id="itemModalHistoryBtn" class="btn btn-sm" data-onclick="items.loadModalHistory()" data-i18n="ui.modals.show_rate_name_changes">Show rate &amp; name changes</button>
                    <div id="itemModalHistoryList"></div>
                </div>
                <div class="item-modal-danger">
                    <button type="button" class="btn btn-danger btn-sm" id="itemModalArchiveBtn" data-onclick="items.archiveFromModal()" hidden data-i18n="ui.items.archive_item">Archive item</button>
                </div>
            </div>
            <div class="bill-details-footer item-modal-footer">
                <button type="button" class="btn btn-ghost" data-dismiss data-onclick="items.closeItemModal()" data-i18n="ui.modals.cancel">Cancel</button>
                <button type="button" class="btn btn-primary" data-onclick="items.saveItemFromModal()" data-i18n="ui.common.save">Save</button>
            </div>
        </div>
    </div>
