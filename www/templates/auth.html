<!-- Authentication Screen -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <h1 data-i18n="ui.app.name">happa</h1>
                <p data-i18n="ui.app.tagline">Your business, in one place</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="window.app.auth.showTab('login'); return false;">Login</button>
                <button class="auth-tab" onclick="window.app.auth.showTab('register'); return false;">Register</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <form onsubmit="window.app.auth.login(); return false;">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <div id="loginMessage" class="auth-message" role="alert" aria-live="assertive" aria-atomic="true"></div>
                    <button type="submit" class="auth-btn">Login</button>
                </form>
                <button type="button" class="auth-reset-toggle" id="resetToggle" aria-expanded="false" aria-controls="resetForm" onclick="window.app.auth.forgotPassword(); return false;" data-i18n="ui.auth.forgot_password">Forgot password?</button>
                <form id="resetForm" class="auth-reset-form" hidden onsubmit="window.app.auth.sendPasswordReset(); return false;">
                    <div class="form-group">
                        <label for="resetEmail" data-i18n="ui.auth.reset_email_label">Email for the reset link</label>
                        <input type="email" id="resetEmail" autocomplete="email" required placeholder="Enter your email" data-i18n-placeholder="ui.auth.reset_email_placeholder">
                    </div>
                    <button type="submit" class="auth-btn auth-reset-send" data-i18n="ui.auth.send_reset_link">Send reset link</button>
                </form>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="auth-form hidden">
                <h2>Create Account</h2>
                <form onsubmit="window.app.auth.register(); return false;">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="registerName" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="registerEmail" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="registerPassword" placeholder="Create a password (min 6 characters)" autocomplete="new-password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" autocomplete="new-password" required minlength="6">
                    </div>
                    <div id="registerMessage" class="auth-message" role="alert" aria-live="assertive" aria-atomic="true"></div>
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>
                <p class="auth-link">Already have an account? <a href="#" onclick="window.app.auth.showTab('login'); return false;">Login</a></p>
            </div>

            <div class="auth-lang-links" id="authLangLinks" role="group" aria-label="Language" data-i18n-aria-label="ui.settings.language">
                <button type="button" class="auth-lang-link" data-lang-option="en" lang="en" aria-pressed="true" onclick="window.app.i18n.setLang('en')">English</button>
                <span class="auth-lang-sep" aria-hidden="true">|</span>
                <button type="button" class="auth-lang-link" data-lang-option="hi" lang="hi" aria-pressed="false" onclick="window.app.i18n.setLang('hi')">हिंदी</button>
            </div>
        </div>
    </div>
