    <!-- Firebase SDK (deferred: deferred classic scripts and module scripts run
         in document order after parsing, so firebaseConfig.js and js/main.js
         still see `firebase` ready. Nothing inline uses `firebase`.)
         Self-hosted, byte-identical copies of the gstatic 10.7.1 builds so the
         service worker can precache them and the app opens with no network
         (see www/vendor/README.md). SRI makes a corrupt cached copy fail to
         run; firebaseConfig.js then purges it and reloads once. -->
    <script defer src="vendor/firebase/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4"></script>
    <script defer src="vendor/firebase/10.7.1/firebase-auth-compat.js" integrity="sha384-lI+CxEx/bCvWP1b0OK13j5HTrTZP7yf1xle8TVOFq2smz6KC1RChTarRV/RHP5PP"></script>
    <script defer src="vendor/firebase/10.7.1/firebase-firestore-compat.js" integrity="sha384-nwX2Qpkhc2sv6L0ZPkLefLGguao67toSowvePuQvGF6cG+8MUphGI2uI94Ls3JF7"></script>
    <!-- SheetJS (Excel) is loaded on demand via js/utils/lazy-scripts.js -->
</head>
<body>
    <!-- Apply the saved theme and appearance before first paint (same keys and rules as js/ui/theme.js). The one inline script:
         keep it on one line; its sha256 is in the CSP's script-src (firebase.json, security-headers.test.js). -->
    <script id="themeBoot">try{var s=localStorage,d=document.documentElement,o=s.getItem('darkMode'),t=s.getItem('happa.theme')||'modern',a=s.getItem('happa.appearance')||(o==='true'?'dark':o==='false'||s.getItem('aadhat.itemNamesFollowLang')!==null?'light':'system'),m=s.getItem('happa.themeKind')==='dark'||a==='dark'||a==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',c=s.getItem('happa.bar.'+m),e=document.querySelector('meta[name="theme-color"]');d.setAttribute('data-theme',t);d.setAttribute('data-appearance',a);d.setAttribute('data-mode',m);if(m==='dark')document.body.classList.add('dark-mode');if(e&&/^#[0-9a-f]{6}$/i.test(c))e.setAttribute('content',c)}catch(x){}</script>
    <!-- All HTML content is dynamically loaded from templates/ directory -->
    <!-- See templates/*.html for all readable HTML templates -->
    
    <!-- Firebase Configuration -->
    <script defer src="firebaseConfig.js"></script>
    
    <!-- Service worker registration + auto-reload on a new version -->
    <script defer src="js/boot/sw-register.js?v=20261108bj"></script>
    
    <!-- ES6 Modular Architecture (loads and injects all templates) -->
    <script type="module" src="js/main.js?v=20261108bj"></script>
    <script type="module" src="js/utils/keyboard-shortcuts.js?v=20261108bj"></script>

</body>
