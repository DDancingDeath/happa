<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>happa</title>
    <meta name="description" content="happa: Your business, in one place">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#667eea">
    <script>
        window.addEventListener('beforeinstallprompt', function (e) { window.__installPromptEvent = e; });
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23667eea' width='100' height='100' rx='20'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'>A</text></svg>">
    
    <!-- Preconnect to origins needed during startup -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>

    <!-- Styles: one file, joined from the list in styles.css (npm run build:css, #66) -->
    <link rel="stylesheet" href="css/app.css?v=20261101zzuzieecmbbkhbnh">
    
    <!-- Firebase SDK (deferred: deferred classic scripts and module scripts run
         in document order after parsing, so firebaseConfig.js and js/main.js
         still see `firebase` ready. Nothing inline uses `firebase`.)
         Self-hosted, byte-identical copies of the gstatic 10.7.1 builds so the
         service worker can precache them and the app opens with no network
         (see www/vendor/README.md). SRI makes a corrupt cached copy fail to
         run; firebaseConfig.js then purges it and reloads once. -->
    <script defer src="vendor/firebase/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4"></script>
    <script defer src="vendor/firebase/10.7.1/firebase-auth-compat.js" integrity="sha384-lI+CxEx/bCvWP1b0OK13j5HTrTZP7yf1xle8TVOFq2smz6KC1RChTarRV/RHP5PP"></script>
    <script defer src="vendor/firebase/10.7.1/firebase-firestore-compat.js" integrity="sha384-nwX2Qpkhc2sv6L0ZPkLefLGguao67toSowvePuQvGF6cG+8MUphGI2uI94Ls3JF7"></script>
    <!-- SheetJS (Excel) is loaded on demand via js/utils/lazy-scripts.js -->
</head>
<body>
    <!-- Apply the saved theme before first paint (Settings only applies it once opened). -->
    <script id="themeBoot">
        try { if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode'); } catch (e) {}
    </script>
    <!-- All HTML content is dynamically loaded from templates/ directory -->
    <!-- See templates/*.html for all readable HTML templates -->
    
    <!-- Firebase Configuration -->
    <script defer src="firebaseConfig.js"></script>
    
    <!-- Service Worker Registration + auto-reload on new version.
         When a new SW takes control (after deploy), reload the page so the
         user immediately sees the new code without a manual hard-refresh. -->
    <script>
        if ('serviceWorker' in navigator) {
            let __reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (__reloading) return;
                __reloading = true;
                console.log('[SW] New service worker took control — reloading for fresh code.');
                window.location.reload();
            });

            window.addEventListener('load', () => {
                let pending;
                try {
                    pending = Promise.resolve(navigator.serviceWorker.register('/service-worker.js'));
                } catch (err) {
                    pending = Promise.reject(err);
                }
                pending
                    .then((registration) => {
                        if (!registration) return;
                        // Check for updates every time the page becomes visible.
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') {
                                registration.update?.()?.catch?.(() => {});
                            }
                        });

                        // When a new SW is found, tell it to skip waiting so
                        // it activates immediately (instead of waiting for all
                        // tabs to close).
                        registration.addEventListener?.('updatefound', () => {
                            const sw = registration.installing;
                            if (!sw) return;
                            sw.addEventListener('statechange', () => {
                                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('[SW] Update installed; activating new version.');
                                    try { sw.postMessage({ type: 'SKIP_WAITING' }); } catch (_) {}
                                }
                            });
                        });
                    })
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
    
    <!-- ES6 Modular Architecture (loads and injects all templates) -->
    <script type="module" src="js/main.js?v=20261101zzuzieecmbbkhbnh"></script>
    <script type="module" src="js/utils/keyboard-shortcuts.js?v=20261101zzuzieecmbbkhbnh"></script>

</body>
</html>
